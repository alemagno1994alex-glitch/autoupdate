<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XromITA</title>
    <style>
        body {
            background: #050505;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        #menu-box {
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid #333;
            padding: 40px;
            border-radius: 15px;
            box-shadow: -15px 0 30px rgba(0, 146, 70, 0.4),
                         0 0 30px rgba(255, 255, 255, 0.2),
                         15px 0 30px rgba(206, 43, 55, 0.4);
            text-align: center;
            transition: opacity 0.5s ease;
            width: 80%;
            max-width: 350px;
        }

        #menu-box h2 {
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff;
        }

        .player-btn {
            display: block;
            width: 100%;
            background: transparent;
            padding: 15px 20px;
            margin: 20px 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            font-family: 'Courier New', Courier, monospace;
        }

        .btn-green {
            color: #009246;
            border: 2px solid #009246;
            box-shadow: 0 0 10px #009246, inset 0 0 10px #009246;
            text-shadow: 0 0 5px #009246;
        }

        .btn-green:hover, .btn-green:active {
            background: #009246;
            color: #ffffff;
            box-shadow: 0 0 20px #009246, inset 0 0 20px #009246;
            text-shadow: none;
        }

        .btn-red {
            color: #ce2b37;
            border: 2px solid #ce2b37;
            box-shadow: 0 0 10px #ce2b37, inset 0 0 10px #ce2b37;
            text-shadow: 0 0 5px #ce2b37;
        }

        .btn-red:hover, .btn-red:active {
            background: #ce2b37;
            color: #ffffff;
            box-shadow: 0 0 20px #ce2b37, inset 0 0 20px #ce2b37;
            text-shadow: none;
        }

        #loading-text {
            color: #ffffff;
            display: none;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff;
            animation: neonPulse 1.5s infinite alternate;
        }

        @keyframes neonPulse {
            from { opacity: 0.5; text-shadow: 0 0 5px #ffffff; }
            to { opacity: 1; text-shadow: 0 0 15px #ffffff, 0 0 25px #ffffff; }
        }

        #error-box {
            text-align: center;
            padding: 20px;
            font-size: 16px;
            letter-spacing: 1px;
            display: none;
            font-weight: bold;
            border: 2px solid #ce2b37;
            box-shadow: 0 0 15px #ce2b37;
            background: rgba(206, 43, 55, 0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body id="main-body">

    <div id="menu-box">
        <h2>Seleziona Lettore</h2>
        <button class="player-btn btn-green" onclick="startPlayer('eskeyfhd47298')">â¡X1 [Zapping]</button>
        <button class="player-btn btn-red" onclick="startPlayer('eskeyfhd47298-2')">ðºX2 [Tricolore]</button>
    </div>

    <div id="loading-text">Inizializzazione...</div>

    <div id="error-box"></div>

    <script>
        const menuBox = document.getElementById('menu-box');
        const loadingText = document.getElementById('loading-text');
        const errBox = document.getElementById('error-box');

        function showError(msg, color = "#ce2b37") {
            loadingText.style.display = "none";
            menuBox.style.display = "none";
            errBox.style.color = color;
            errBox.innerText = msg;
            errBox.style.display = "block";
        }

        function startPlayer(version) {
            menuBox.style.opacity = '0';
            setTimeout(() => {
                menuBox.style.display = 'none';
                loadingText.style.display = 'block';
                bootApp(version);
            }, 500);
        }

        async function bootApp(PLAYER_VERSION) {
            try {
                if(navigator.webdriver || navigator.userAgent.includes('Genymotion') || navigator.userAgent.includes('Waydroid')) {
                    throw new Error("SECURITY BREACH DETECTED.");
                }

                let res1;
                try {
                    res1 = await fetch('https://xrom-ital-tg.work/omega-auth.php?p=x_pulse_6797d2&shield=Omega-V6-Shield&_cb=' + Date.now());
                } catch(netErr) {
                    throw new Error("Rete Bloccata (Impossibile Raggiungere XromITA Server)");
                }

                if (!res1.ok) throw new Error("Errore Server: " + res1.status);
                let auth = await res1.json();

                if(auth.status === 'GRANT_ACCESS' && auth.engine_token) {

                    let res2 = await fetch('https://xrom-ital-tg.work/omega-engine.php?token=' + auth.engine_token + '&v=' + PLAYER_VERSION);
                    let code = await res2.text();

                    if (code.includes("SECURITY BLOCKED")) throw new Error(code);
                    if (code.includes("ERRORE SERVER")) throw new Error("Il file 'xrom_core_" + PLAYER_VERSION + ".txt' MANCA sul Server.");

                    let cleanCode = code.trim();
                    setTimeout(() => {
                        if (cleanCode.toLowerCase().startsWith("<!doctype") || cleanCode.toLowerCase().startsWith("<html")) {
                            document.open();
                            document.write(cleanCode);
                            document.close();
                        } else {
                            let match = cleanCode.match(/<script[^>]*>([\s\S]*?)<\/script>/i);
                            let jsCode = match ? match[1] : cleanCode;
                            window.eval(jsCode);
                        }
                    }, 100);
                } else if (auth.status === 'DEFCON') {
                    showError("SERVER IN MANUTENZIONE (OFFLINE)", "#f59e0b");
                } else {
                    throw new Error("Accesso negato dal Server");
                }
            } catch(e) {
                showError("BLOCCO DI SISTEMA: " + e.message);
            }
        }
    </script>
</body>
</html>
