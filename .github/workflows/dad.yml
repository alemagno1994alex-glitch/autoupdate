name: Aggiorna Daddy su Gist

on:
  # Esegui automaticamente ogni giorno alle 8:00 (UTC)
  schedule:
   
    - cron: '0 5 * * *'    # 7
    - cron: '0 12 * * *'   # 14
    - cron: '0 19 * * *'   # 21
    
  #  Permette di eseguire manualmente il workflow dalla UI di GitHub
  workflow_dispatch:

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esegui lo script
        env:
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}   # Token personale per i Gist
          GIST_ID: ${{ secrets.GIST_ID }}           # ID del tuo Gist
          GIST_FILENAME: ${{ secrets.GIST_FILENAME || 'daddyeventi.m3u' }}
          OFFSET_HOURS: ${{ secrets.OFFSET_HOURS || '2' }}
        run: python daddy.py