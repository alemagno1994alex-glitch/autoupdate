name: Pubblica TG

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 11 * * *'          # ogni giorno alle 11:00 UTC
  workflow_dispatch:               # esecuzione manuale

permissions:
  contents: read                   # solo lettura del repo, niente commit

jobs:
  publish-gist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate playlist
        run: python tg.py

      - name: Publish to secret Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID:    ${{ secrets.GIST_ID }}   # opzionale
        run: |
          # Se GIST_ID non è impostato, crea un nuovo gist
          if [ -z "$GIST_ID" ]; then
            echo "📦 Creazione di un nuovo gist privato..."
            RESPONSE=$(curl -s -X POST \
              -H "Authorization: token $GIST_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/gists \
              -d "{
                \"description\": \"Playlist TGR regioni (aggiornata automaticamente)\",
                \"public\": false,
                \"files\": {
                  \"tg_regionali.m3u\": {
                    \"content\": $(jq -Rs . < tg_regionali.m3u)
                  }
                }
              }")
            GIST_ID=$(echo "$RESPONSE" | jq -r '.id')
            echo "✅ Nuovo gist creato con ID: $GIST_ID"
            echo "⚠️  Aggiungi questo ID come secret 'GIST_ID' per i prossimi aggiornamenti."
            echo "🔗 URL: https://gist.github.com/$GIST_ID"
          else
            echo "🔄 Aggiornamento del gist esistente ($GIST_ID)..."
            curl -s -X PATCH \
              -H "Authorization: token $GIST_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/gists/$GIST_ID \
              -d "{
                \"files\": {
                  \"tg_regionali.m3u\": {
                    \"content\": $(jq -Rs . < tg_regionali.m3u)
                  }
                }
              }"
            echo "✅ Gist aggiornato: https://gist.github.com/$GIST_ID"
          fi
          