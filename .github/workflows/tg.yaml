name: Aggiorna playlist TGR e pubblica su Gist

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 11 * * *'          # ogni giorno alle 11:00 UTC
  workflow_dispatch:               # esecuzione manuale

permissions:
  contents: read                   # solo lettura del repo

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate playlist
        run: python tg.py

      - name: Publish to secret gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID:    ${{ secrets.GIST_ID }}      # opzionale: se non impostato, crea un nuovo gist
        run: |
          # Se non c'è un GIST_ID, ne crea uno nuovo e lo salva come secret (solo la prima volta)
          if [ -z "$GIST_ID" ]; then
            echo "Nessun GIST_ID trovato. Creazione di un nuovo gist..."
            RESPONSE=$(curl -s -X POST \
              -H "Authorization: token $GIST_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/gists \
              -d "{
                \"description\": \"Playlist TGR regioni\",
                \"public\": false,
                \"files\": {
                  \"tg_regionali.m3u\": {
                    \"content\": $(jq -Rs . < tg_regionali.m3u)
                  }
                }
              }")
            GIST_ID=$(echo "$RESPONSE" | jq -r '.id')
            echo "GIST_ID=$GIST_ID" >> $GITHUB_ENV
            # NOTA: dovrai aggiungere manualmente questo ID come secret nel repo per i prossimi run
            echo "Il nuovo Gist ID è: $GIST_ID. Aggiungilo come secret GIST_ID per i prossimi aggiornamenti."
          else
            # Aggiorna il gist esistente
            curl -s -X PATCH \
              -H "Authorization: token $GIST_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/gists/$GIST_ID \
              -d "{
                \"files\": {
                  \"tg_regionali.m3u\": {
                    \"content\": $(jq -Rs . < tg_regionali.m3u)
                  }
                }
              }"
            echo "Gist aggiornato: https://gist.github.com/$GIST_ID"
          fi