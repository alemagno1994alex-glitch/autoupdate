name: Aggiorna playlist TGR

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate playlist
        run: |
          echo "### Esecuzione script ###"
          python tg.py
          echo "### Contenuto del file generato ###"
          cat tg_regionali.m3u || echo "Il file non esiste"
          echo "### Dettagli del file ###"
          ls -la tg_regionali.m3u || echo "Il file non esiste"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tg_regionali.m3u
          git diff --staged --quiet || git commit -m "Aggiornamento automatico playlist [skip ci]"
          git push