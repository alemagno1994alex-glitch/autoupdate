name: Aggiorna playlist Rakuten TV su Gist

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Esegui script di aggiornamento
        env:
          CLASSIFICATION: it
        run: python rakuten.py rakuten.m3u

      - name: Upload to private Gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          if [ -z "$GIST_ID" ]; then
            echo "❌ Secret GIST_ID non impostato"
            exit 1
          fi
          echo "📤 Aggiornamento del Gist $GIST_ID..."
          CONTENT=$(jq -Rs . rakuten.m3u)
          curl -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/gists/$GIST_ID \
            -d "{\"files\":{\"rakuten.m3u\":{\"content\": $CONTENT}}}"
          echo "✅ Gist aggiornato con successo!"