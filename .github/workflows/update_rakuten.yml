name: Aggiorna playlist Rakuten

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          pip install --upgrade pip
          pip install requests python-dotenv
          echo "✓ Dipendenze installate"

      - name: Verifica file rakuten.py
        run: |
          echo "========================================"
          echo "Verifica User-Agent nel file"
          echo "========================================"
          grep -n "user_agent" rakuten.py | head -5
          echo ""
          if grep -q "Firefox/128" rakuten.py; then
            echo "✅ User-Agent CORRETTO (Firefox/128)"
          elif grep -q "Firefox/98" rakuten.py; then
            echo "❌ User-Agent VECCHIO (Firefox/98)"
          else
            echo "❓ User-Agent sconosciuto"
          fi

      - name: Genera playlist
        env:
          CLASSIFICATION: it
        run: |
          echo "========================================"
          echo "Inizio generazione playlist"
          echo "========================================"
          python rakuten.py rakuten.m3u 2>&1
          echo ""
          echo "========================================"
          echo "Verifica file generato"
          echo "========================================"
          if [ -f rakuten.m3u ]; then
            SIZE=$(wc -c < rakuten.m3u)
            CHANNELS=$(grep -c '#EXTINF' rakuten.m3u || echo 0)
            STREAMS=$(grep -c "http" rakuten.m3u || echo 0)
            NOSTREAM=$(grep -c "# no_stream" rakuten.m3u || echo 0)
            
            echo "✓ File creato"
            echo "  - Dimensione: $SIZE bytes"
            echo "  - Canali totali: $CHANNELS"
            echo "  - Stream validi: $STREAMS"
            echo "  - Senza stream (# no_stream): $NOSTREAM"
            echo ""
            echo "========================================"
            echo "Primi 20 righe del file:"
            echo "========================================"
            head -20 rakuten.m3u
            echo ""
            echo "========================================"
            echo "Ultimi 20 righe del file:"
            echo "========================================"
            tail -20 rakuten.m3u
          else
            echo "❌ Errore: File non creato"
            exit 1
          fi

      - name: Carica su Gist
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$GIST_ID" ]; then
            echo "⚠️  Variabili di ambiente non configurate, skip upload"
            exit 0
          fi

          echo "Upload della playlist su Gist..."
          
          # Leggi il file e codificalo in JSON
          CONTENT=$(jq -Rs . rakuten.m3u)
          
          # Effettua il PATCH al Gist
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/gists/$GIST_ID \
            -d "{\"files\":{\"rakuten.m3u\":{\"content\": $CONTENT}}}")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Upload su Gist completato (HTTP $HTTP_CODE)"
          else
            echo "❌ Errore upload (HTTP $HTTP_CODE)"
            echo "$BODY"
            exit 1
          fi

      - name: Notifica errore
        if: failure()
        run: |
          echo "❌ Workflow fallito"
          exit 1
