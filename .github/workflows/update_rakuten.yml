name: Aggiorna playlist Rakuten

on:
  schedule:
    - cron: '0 6 * * *'      # ogni giorno alle 6:00 UTC
  push:
    branches: [ main ]
  workflow_dispatch:         # esecuzione manuale

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate M3U playlist
        env:
          CLASSIFICATION: it    # modifica il paese se necessario
        run: python rakuten_m3u_generator.py rakuten.m3u

      - name: Update private Gist
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('rakuten.m3u', 'utf8');
            const gistId = process.env.GIST_ID;
            await github.rest.gists.update({
              gist_id: gistId,
              files: {
                'rakuten.m3u': {
                  content: content
                }
              }
            });
        env:
          GIST_ID: ${{ secrets.GIST_ID }}