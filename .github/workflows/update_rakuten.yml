name: Aggiorna playlist Rakuten TV su Gist

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
     
      - name: Upload to private Gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -z "${{ secrets.GIST_ID }}" ]; then
            echo "❌ Secret GIST_ID non impostato"
            exit 1
          fi
          echo "📤 Aggiornamento del Gist ${{ secrets.GIST_ID }}..."
          gh gist edit "${{ secrets.GIST_ID }}" --filename rakuten.m3u rakuten.m3u
          echo "✅ Gist aggiornato con successo!"