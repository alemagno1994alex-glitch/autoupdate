name: Aggiorna online su Gist

on:
  schedule:
    # Esegue alle 9:00 e 15:00 UTC (modifica a piacere)
    - cron: '0 12 * * *'   #14
    - cron: '0 17 * * *'   #19
    
  workflow_dispatch:   # permette esecuzione manuale
  push:
    branches: [ main ]

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Esegui script di aggiornamento
        env:
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          GIST_FILE: ${{ secrets.GIST_FILE }}
          GIST_DESCRIPTION: ${{ secrets.GIST_DESCRIPTION }}
          PUBLIC_GIST: ${{ secrets.PUBLIC_GIST }}
        run: python online.py