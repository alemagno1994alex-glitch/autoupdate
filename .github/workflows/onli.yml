name: Aggiorna Online su Gist

on:
  schedule:
    # Esegue ogni giorno alle 6:00 UTC (modifica a piacere)
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
    
  workflow_dispatch:   # permette l'esecuzione manuale
  push:
    branches: [ main ] # opzionale: esegue anche al push su main

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Esegui script di aggiornamento
        env:
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}      # Token con permessi gist
          GIST_ID: ${{ secrets.GIST_ID }}
          SOURCE_URL: ${{ secrets.SOURCE_URL }}        # opzionale
          GIST_FILE: ${{ secrets.GIST_FILE }}          # opzionale
          GIST_DESCRIPTION: ${{ secrets.GIST_DESCRIPTION }} # opzionale
          PUBLIC_GIST: ${{ secrets.PUBLIC_GIST }}      # 'true' o 'false'
        run: python online.py