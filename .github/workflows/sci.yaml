name: Estrai Sci

on:
  schedule:
    - cron: '0 6 * * *'        # ogni giorno alle 6:00 UTC
  workflow_dispatch:           # esecuzione manuale

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run extraction
        env:
          CI: true
          PLAYER: X1          # o X2, a seconda di cosa ti serve
        run: |
          python sci.py

      - name: Upload to Gist (private)
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          GIST_ID="${{ secrets.GIST_ID }}"
          if [ -z "$GIST_ID" ]; then
            echo "⚠️  GIST_ID non impostato. Creo un nuovo gist..."
            gh gist create sky.m3u --private --desc "Sky playlist aggiornata" --filename sci.m3u
          else
            echo "📝 Aggiorno il gist esistente con ID $GIST_ID"
            gh gist edit $GIST_ID -f sky.m3u
          fi