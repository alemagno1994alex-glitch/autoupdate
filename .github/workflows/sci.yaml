- name: Run extraction
  env:
    CI: true
    PLAYER: X1
  run: |
    python sci.py  

- name: Upload to Gist (private)
  env:
    GH_TOKEN: ${{ secrets.GIST_TOKEN }}
  run: |
    GIST_ID="${{ secrets.GIST_ID }}"
    if [ -z "$GIST_ID" ]; then
      gh gist create sky.m3u --private --desc "Sky playlist aggiornata" --filename sky.m3u
    else
      gh gist edit "$GIST_ID" -f sky.m3u -m "Aggiornamento automatico" < sky.m3u
    fi
    