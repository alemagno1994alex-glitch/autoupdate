name: Estrai Sky e carica su Gist

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run extraction
        env:
          CI: true
          PLAYER: X1
        run: |
          python sci.py
          echo "📂 Contenuto dopo esecuzione:"
          ls -la

      - name: Upload to Gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          GIST_ID="${{ secrets.GIST_ID }}"
          if [ ! -f sky.m3u ]; then
            echo "❌ sky.m3u non trovato! Ecco la directory:"
            ls -la
            exit 1
          fi
          if [ -z "$GIST_ID" ]; then
            gh gist create sky.m3u --private --desc "Sky playlist" --filename sky.m3u
          else
            echo "📝 Aggiorno gist $GIST_ID"
            cat sky.m3u | gh gist edit "$GIST_ID" -f sky.m3u -m "Aggiornamento $(date)"
            echo "✅ Fatto."
          fi