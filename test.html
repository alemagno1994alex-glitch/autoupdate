
<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.2/controls.min.css" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      touch-action: pan-y;
    }

    #video-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    video {
      width: 100%;
      height: 100%;
    }

    #overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 16px;
      display: none;
      z-index: 1000;
      pointer-events: none;
      font-family: monospace;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(4px);
    }

  </style>
</head>

<body>
  <div id="video-container">
     <video id="video" autoplay poster="https://alemagno1994alex-glitch.github.io/autoupdate/images/nero.jpg"></video>
    <div id="overlay"></div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.2/shaka-player.compiled.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.2/shaka-player.ui.min.js"></script>
  <script>
    shaka.polyfill.installAll();

    const video = document.getElementById('video');
    const container = document.getElementById('video-container');
    const overlay = document.getElementById('overlay');
    const touchControls = document.getElementById('touch-controls');
    const touchToggle = document.getElementById('touch-toggle');
    let player;
    let isAutoResolution = true;

    // ===== FUNZIONI PER L'ORARIO LIVE =====
    function getLiveTime() {
      if (!player || !player.isLive()) return null;
      try {
        const now = new Date();
        const liveEdge = player.seekRange().end;
        const behind = liveEdge - video.currentTime;
        const liveTime = new Date(now.getTime() - behind * 1000);
        return liveTime;
      } catch (e) {
        return null;
      }
    }

    function formatLiveTime(date) {
      if (!date) return '--:--';
      const hours = date.getHours().toString().padStart(2, '0');
      const mins = date.getMinutes().toString().padStart(2, '0');
      return `${hours}:${mins}`;
    }

    function showOverlay(text, isLive = false) {
      if (isLive && player && player.isLive()) {
        const liveTime = getLiveTime();
        if (liveTime) {
          const behind = player.seekRange().end - video.currentTime;
          const timeStr = formatLiveTime(liveTime);
          overlay.textContent = `🔴 LIVE • ${timeStr} • ${formatTime(behind)} indietro`;
        } else {
          overlay.textContent = text;
        }
      } else {
        overlay.textContent = text;
      }
      overlay.style.display = 'block';
      setTimeout(() => overlay.style.display = 'none', 3000);
    }

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec.toString().padStart(2, '0')}`;
    }

    // ===== GESTIONE RISOLUZIONE CON SOLO FRECCIA SU =====
    function cycleResolution() {
	  if (!player) return;

	  const allTracks = player.getVariantTracks();
	  if (allTracks.length === 0) return;

	  // 1) Qual è la lingua audio attiva? (preservala!)
	  const activeTrack = allTracks.find(t => t.active);
	  const preferredLang = activeTrack ? activeTrack.language : null;

	  // 2) Tieni solo i variant con la stessa lingua audio
	  let tracks = preferredLang
		? allTracks.filter(t => t.language === preferredLang)
		: allTracks;

	  // fallback: se per qualche motivo la lingua non ha variant, usa tutti
	  if (tracks.length === 0) tracks = allTracks;

	  // 3) Deduplica per altezza (così non cicli su 5 varianti 1080p uguali)
	  const seen = new Set();
	  const uniqueTracks = [];
	  for (const t of tracks) {
		const key = t.height || t.width || t.id;
		if (!seen.has(key)) {
		  seen.add(key);
		  uniqueTracks.push(t);
		}
	  }

	  // 4) Cicla come prima
	  if (isAutoResolution) {
		isAutoResolution = false;
		player.configure({ abr: { enabled: false } });
		const firstTrack = uniqueTracks[0];
		player.selectVariantTrack(firstTrack, true);
		// 🔑 ri-applica la lingua audio dopo la selezione
		if (preferredLang) player.selectAudioLanguage(preferredLang);
		showOverlay(`🎬 ${firstTrack.height || firstTrack.width || '?'}p (MANUALE)`);
		return;
	  }

	  const current = uniqueTracks.find(t => t.active) || uniqueTracks[0];
	  const idx = uniqueTracks.findIndex(t => t.id === current.id);
	  const nextIdx = (idx + 1) % uniqueTracks.length;

	  // se siamo tornati al primo dopo l'ultimo → Auto
	  if (nextIdx === 0 && idx === uniqueTracks.length - 1) {
		setAutoResolution();
		if (preferredLang) player.selectAudioLanguage(preferredLang);
		return;
	  }

	  const nextTrack = uniqueTracks[nextIdx];
	  player.selectVariantTrack(nextTrack, true);
	  // 🔑 ri-applica la lingua audio
	  if (preferredLang) player.selectAudioLanguage(preferredLang);

	  showOverlay(`🎬 ${nextTrack.height || nextTrack.width || '?'}p (MANUALE)`);
	}

    function setAutoResolution() {
	  isAutoResolution = true;
	  player.configure({ abr: { enabled: true } });

	  // Ricorda la lingua prima di resettare
	  const active = player.getVariantTracks().find(t => t.active);
	  const lang = active ? active.language : null;

	  if (lang) player.selectAudioLanguage(lang);
	  showOverlay('📊 Risoluzione: AUTO');
	}

    // ===== ALTRE FUNZIONI =====
    function changeLanguage(direction = 'next') {
      if (!player) return;

      const tracks = player.getVariantTracks();
      const activeTrack = tracks.find(t => t.active);

      if (!activeTrack) return;

      const languages = [...new Set(tracks.map(t => t.language))];
      const currentLangIndex = languages.indexOf(activeTrack.language);

      let nextLangIndex;
      if (direction === 'next') {
        nextLangIndex = (currentLangIndex + 1) % languages.length;
      } else {
        nextLangIndex = (currentLangIndex - 1 + languages.length) % languages.length;
      }

      const nextLang = languages[nextLangIndex];
      const langTracks = tracks.filter(t => t.language === nextLang);

      if (langTracks.length > 0) {
        player.selectAudioLanguage(nextLang);
        showOverlay(`🌍 Lingua: ${nextLang.toUpperCase()}`);
      }
    }

    function toggleSubtitles() {
      if (!player) return;

      const isVisible = player.isTextTrackVisible();
      const textTracks = player.getTextTracks();

      if (!isVisible && textTracks.length > 0) {
        player.selectTextTrack(textTracks[0]);
      }

      player.setTextTrackVisibility(!isVisible);
      showOverlay(`📝 Sottotitoli: ${player.isTextTrackVisible() ? 'ON' : 'OFF'}`);
    }


    // ===== INIT PLAYER =====
    async function initPlayer() {
      const urlParams = new URLSearchParams(window.location.search);
      const manifestUrl = urlParams.get("url");
      const licenseKey = urlParams.get("key");

      if (!manifestUrl || !licenseKey) {
        showOverlay("❌ URL o chiavi mancanti");
        console.error("Manifest URL o ClearKey non forniti.");
        return;
      }

      player = new shaka.Player(video);
      const ui = new shaka.ui.Overlay(player, container, video);
      ui.configure({
        controlPanelElements: ['play_pause', 'volume', 'time_and_duration', 'fullscreen', 'quality', 'captions', 'audio'],
        addSeekBar: true,
        addBigPlayButton: false
      });

      try {
        const keys = JSON.parse(decodeURIComponent(licenseKey));
        const clearKeys = {};
        keys.forEach(({ keyId, key }) => clearKeys[keyId] = key);
        player.configure({ 
          drm: { clearKeys },
          abr: { enabled: true }
        });

		await player.load(manifestUrl);
		video.play();

		// ===== PREFERENZA LINGUA AUDIO (default: italiano) =====
		const preferLang = (urlParams.get('lang') || 'it').toLowerCase().trim();
		try {
		  // Shaka espone le lingue come codici ISO 639-1/2 ("it", "en", "ita", ...)
		  const audioLangs = player.getAudioLanguages();
		  console.log('🎧 Lingue audio disponibili:', audioLangs);

		  // Match in ordine di priorità:
		  // 1. esatto  → "it"
		  // 2. prefisso → "it-IT", "ita"
		  // 3. regex   → "italian", "italiano"
		  const match =
			   audioLangs.find(l => l.toLowerCase() === preferLang)
			|| audioLangs.find(l => l.toLowerCase().startsWith(preferLang))
			|| audioLangs.find(l => /^(it|ita)\b/i.test(l))
			|| audioLangs.find(l => /ital/i.test(l));

		  if (match) {
			player.selectAudioLanguage(match);
			console.log('✅ Lingua audio selezionata:', match);
		  } else {
			console.warn('⚠️ Nessuna traccia italiana trovata, uso il default');
		  }
		} catch (e) {
		  console.warn('Errore selezione lingua audio:', e);
		}

		const tracks = player.getVariantTracks();
		const activeTrack = tracks.find(t => t.active);
		if (activeTrack) {
           // showOverlay(`🎬 ${activeTrack.height || 'Auto'}p | 🌍 ${activeTrack.language.toUpperCase()}`);
        }
      } catch (e) {
        showOverlay("⚠️ Errore nel caricamento");
        console.error("Errore:", e);
      }

   
      // ===== KEYBOARD CONTROLS =====
      document.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();

        switch (key) {
          case 'enter':
            if (video.paused) {
              video.play();
            } else {
              video.pause();
            }
            if (player.isLive()) {
              const liveTime = getLiveTime();
              if (liveTime) {
                const behind = player.seekRange().end - video.currentTime;
                const timeStr = formatLiveTime(liveTime);
                showOverlay(`🔴 LIVE • ${timeStr} • ${formatTime(behind)} indietro`);
              } else {
                const now = new Date();
                const liveEdge = player.seekRange().end;
                const behind = liveEdge - video.currentTime;
                const liveTime = new Date(now.getTime() - behind * 1000);
                const h = liveTime.getHours().toString().padStart(2, '0');
                const m = liveTime.getMinutes().toString().padStart(2, '0');
                showOverlay(`🔴 LIVE • ${h}:${m} • ${formatTime(behind)} indietro`);
              }
            } else {
              showOverlay(`Timeline: ${formatTime(video.currentTime)} / ${formatTime(video.duration)}`);
            }
            break;

          case 'arrowup':
            cycleResolution();
            break;

          case 'arrowleft':
            video.currentTime = Math.max(video.currentTime - 10, 0);
            if (player && player.isLive()) {
              const liveTime = getLiveTime();
              if (liveTime) {
                const behind = player.seekRange().end - video.currentTime;
                const timeStr = formatLiveTime(liveTime);
                showOverlay(`⏪ ${timeStr} (${formatTime(behind)} indietro)`);
              } else {
                showOverlay(`⏪ ${formatTime(video.currentTime)}`);
              }
            } else {
              showOverlay(`⏪ ${formatTime(video.currentTime)}`);
            }
            break;

          case 'arrowright':
            const maxTime = player && player.isLive() ? player.seekRange().end : video.duration;
            video.currentTime = Math.min(video.currentTime + 10, maxTime);
            if (player && player.isLive()) {
              const liveTime = getLiveTime();
              if (liveTime) {
                const behind = player.seekRange().end - video.currentTime;
                const timeStr = formatLiveTime(liveTime);
                showOverlay(`⏩ ${timeStr} (${formatTime(behind)} indietro)`);
              } else {
                showOverlay(`⏩ ${formatTime(video.currentTime)}`);
              }
            } else {
              showOverlay(`⏩ ${formatTime(video.currentTime)}`);
            }
            break;

          case 'arrowdown':
            const textTracks = player.getTextTracks();
            if (textTracks.length === 0) {
              showOverlay('⚠️ Nessun sottotitolo disponibile');
              break;
            }
            const isVisible = player.isTextTrackVisible();
            const activeText = textTracks.find(t => t.active);
            const currentIdx = activeText ? textTracks.indexOf(activeText) : -1;
            const nextIdx = currentIdx + 1;

            if (!isVisible) {
              player.selectTextTrack(textTracks[0]);
              player.setTextTrackVisibility(true);
              showOverlay(`💬 ${textTracks[0].language?.toUpperCase() || 'Sub 1'}`);
            } else if (nextIdx < textTracks.length) {
              player.selectTextTrack(textTracks[nextIdx]);
              showOverlay(`💬 ${textTracks[nextIdx].language?.toUpperCase() || `Sub ${nextIdx + 1}`}`);
            } else {
              player.setTextTrackVisibility(false);
              showOverlay('💬 Sottotitoli: OFF');
            }
            break;

          case ' ':
            event.preventDefault();
            video.paused ? video.play() : video.pause();
            showOverlay(video.paused ? '⏸️ Pausa' : '▶️ Play');
            break;

          case 's':
          case 'subtitle':
          case 'subtitles':
            toggleSubtitles();
            break;

         
        }
      });
    }

    document.addEventListener("DOMContentLoaded", initPlayer);

   
  </script>
</body>

</html>
