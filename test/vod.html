<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VOD · StreamingCommunity</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root{--primary:#00e676;--bg:#050505;--text:#fff;--muted:#8a8a8a;--card:#111}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#222;border-radius:4px}

/* ── FOCUS ── */
.focusable{outline:3px solid transparent;outline-offset:2px;transition:outline .15s,transform .2s}
.focusable.tv-focus{outline:3px solid var(--primary) !important;z-index:50}

header{position:sticky;top:0;z-index:100;
  background:linear-gradient(to bottom,rgba(0,0,0,.95),transparent);
  padding:18px 4%;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-size:1.6rem;font-weight:900}
.logo span{background:linear-gradient(45deg,#00ff41,#008f11);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.search-wrap{flex:1;max-width:520px;margin-left:auto;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  border-radius:30px;padding:10px 18px;display:flex;align-items:center;gap:10px;transition:.2s}
.search-wrap:focus-within{border-color:var(--primary)}
.search-wrap.tv-focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,230,118,.25)}
.search-wrap input{flex:1;background:transparent;border:none;color:#fff;
  font-family:inherit;font-size:1rem;outline:none}

.section{padding:0 4% 30px}
.section-title{font-size:1.3rem;font-weight:800;margin:25px 0 15px;
  display:flex;align-items:center;gap:10px}
.section-title i{color:var(--primary)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.card{background:var(--card);border-radius:8px;overflow:hidden;cursor:pointer;
  position:relative;aspect-ratio:2/3;transition:transform .25s,box-shadow .25s;
  border:1px solid rgba(255,255,255,.04)}
.card:hover,.card.tv-focus{transform:translateY(-6px) scale(1.02);
  box-shadow:0 16px 40px rgba(0,0,0,.7);border-color:var(--primary);outline:none}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.75);
  backdrop-filter:blur(6px);padding:4px 8px;border-radius:6px;font-size:.75rem;
  font-weight:800;color:#ffd700;display:flex;gap:4px;align-items:center}
.card .type{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.75);
  backdrop-filter:blur(6px);padding:4px 8px;border-radius:6px;font-size:.7rem;
  color:var(--primary);font-weight:700}
.card .overlay{position:absolute;bottom:0;left:0;right:0;padding:30px 12px 12px;
  background:linear-gradient(transparent,rgba(0,0,0,.95));
  font-size:.85rem;font-weight:700;line-height:1.3}
.card .overlay .year{color:var(--muted);font-weight:400;font-size:.78rem}

.filters{display:flex;gap:10px;overflow-x:auto;padding:0 4% 20px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  padding:8px 16px;border-radius:20px;font-size:.85rem;font-weight:700;
  cursor:pointer;white-space:nowrap;transition:.2s;color:#fff;font-family:inherit}
.chip.active,.chip:hover,.chip.tv-focus{background:var(--primary);color:#000;border-color:var(--primary)}

#details{position:fixed;inset:0;background:#050505;z-index:200;overflow-y:auto;display:none}
#details.open{display:block}
.details-hero{position:relative;min-height:75vh;display:flex;align-items:flex-end;
  padding:80px 5% 60px;background-size:cover;background-position:center 25%;
  background-repeat:no-repeat}
.details-hero::before{content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom,
    rgba(5,5,5,.20) 0%,rgba(5,5,5,.45) 35%,rgba(5,5,5,.85) 75%,#050505 100%)}
.details-body{position:relative;display:flex;gap:30px;align-items:flex-end;
  max-width:1400px;margin:auto;width:100%}
.details-poster{width:230px;border-radius:10px;flex-shrink:0;
  box-shadow:0 20px 50px rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.1)}
.details-info{flex:1;min-width:0}
.details-info h1{font-size:2.5rem;font-weight:900;line-height:1.1;margin-bottom:12px}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tag{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  padding:5px 12px;border-radius:8px;font-size:.85rem;font-weight:700}
.tag.green{color:#46d369}
.overview{color:#ccc;line-height:1.6;font-size:1rem;margin-bottom:22px;max-width:750px}

.actions{display:flex;gap:12px;flex-wrap:wrap;flex-direction:column;align-items:flex-start}
.btn{display:inline-flex;align-items:center;gap:10px;border:none;
  border-radius:30px;padding:14px 28px;font-size:1rem;font-weight:800;
  font-family:inherit;cursor:pointer;transition:.2s}
.btn-primary{background:var(--primary);color:#000}
.btn-primary:hover,.btn-primary.tv-focus{filter:brightness(1.15);transform:scale(1.03)}

.ep-section{position:relative;padding:20px 5% 60px;max-width:1400px;margin:0 auto}
.ep-section h2{font-size:1.2rem;font-weight:800;margin-bottom:16px;
  display:flex;align-items:center;gap:10px}
.ep-section h2 i{color:var(--primary)}
.season-bar{display:flex;gap:10px;overflow-x:auto;margin-bottom:18px;
  padding-bottom:6px;scrollbar-width:none}
.season-bar::-webkit-scrollbar{display:none}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ep-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;overflow:hidden;cursor:pointer;transition:.25s;
  display:flex;flex-direction:column}
.ep-card:hover,.ep-card.tv-focus{transform:translateY(-3px);border-color:var(--primary);
  box-shadow:0 10px 30px rgba(0,0,0,.5);outline:3px solid var(--primary)}
.ep-thumb{width:100%;aspect-ratio:16/9;background:#111;position:relative}
.ep-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ep-play{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;background:rgba(0,0,0,.35);opacity:0;transition:.25s}
.ep-card:hover .ep-play,.ep-card.tv-focus .ep-play{opacity:1}
.ep-play i{font-size:2.2rem;color:var(--primary);
  filter:drop-shadow(0 0 12px rgba(0,230,118,.6))}
.ep-badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.8);
  backdrop-filter:blur(4px);color:var(--primary);font-size:.75rem;
  font-weight:900;padding:3px 9px;border-radius:6px}
.ep-info{padding:12px 14px}
.ep-title{font-weight:700;font-size:.92rem;margin-bottom:4px}
.ep-desc{font-size:.8rem;color:#999;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}

.back-btn{position:fixed;top:20px;left:20px;z-index:210;width:46px;height:46px;
  border-radius:50%;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.2);color:#fff;display:flex;
  align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem}
.back-btn:hover,.back-btn.tv-focus{background:var(--primary);color:#000;border-color:var(--primary)}

.empty{grid-column:1/-1;text-align:center;color:#666;padding:60px 0;font-size:1rem}
.loading{grid-column:1/-1;text-align:center;color:#888;padding:40px 0}

@media(max-width:800px){
  .details-body{flex-direction:column;align-items:center;text-align:center}
  .details-info h1{font-size:1.8rem}
  .details-poster{width:170px}
  .meta{justify-content:center}
  .actions{justify-content:center;align-items:center}
  .btn{width:100%;justify-content:center}
  .details-hero{padding-top:90px}
  .ep-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="logo"><span>FILM & SERIE</span></div>
  <div class="search-wrap focusable" id="search-wrap" tabindex="0">
    <i class="fas fa-search" style="color:#666"></i>
    <input id="search" type="text" placeholder="Cerca film, serie, anno..." autocomplete="off">
  </div>
</header>

<div class="filters" id="filters"></div>

<section class="section">
  <div class="section-title"><i class="fas fa-fire"></i> <span id="count-title">Catalogo</span></div>
  <div class="grid" id="grid"></div>
</section>

<div id="details">
  <button class="back-btn focusable" id="back-btn" onclick="closeDetails()" tabindex="0">
    <i class="fas fa-arrow-left"></i>
  </button>
  <div class="details-hero" id="d-hero">
    <div class="details-body">
      <img class="details-poster" id="d-poster" alt="">
      <div class="details-info">
        <h1 id="d-title">—</h1>
        <div class="meta" id="d-meta"></div>
        <p class="overview" id="d-overview"></p>
        <div class="actions" id="d-actions"></div>
      </div>
    </div>
  </div>
  <div class="ep-section" id="ep-section" style="display:none;">
    <h2><i class="fas fa-list"></i> <span>Episodi</span></h2>
    <div class="season-bar" id="season-bar"></div>
    <div class="ep-grid" id="ep-grid"></div>
  </div>
</div>

<script src="data.js"></script>

<script>
const TMDB_API_KEY = '56dd0eb5ddacfa471fda68c68a550eb1';
const IMG_BASE = 'https://image.tmdb.org/t/p';
const SC_BASE = 'https://streamingcommunityz.build';

const DATA = (window.VOD_DATA && window.VOD_DATA.items) || [];
let activeGenre = null;
let filtered = [];
let currentItem = null;
let currentSeasons = [];
let currentSeasonIndex = 0;
let activeView = 'catalog';
let lastFocusedInCatalog = null;

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openExternal(url){window.open(url,'_blank','noopener,noreferrer')}

function getPoster(it){
  if (it.poster) return it.poster;
  if (it.image) return it.image;
  return 'https://via.placeholder.com/300x450/111/666?text=No+Poster';
}
function getGenres(it){
  if (Array.isArray(it.genres)) return it.genres;
  if (typeof it.genre === 'string') return [it.genre];
  return [];
}
function getWatchUrl(it){
  if (it.watch_url) return it.watch_url;
  if (it.sc_id) return `${SC_BASE}/it/watch/${it.sc_id}`;
  return `${SC_BASE}/it/search?q=${encodeURIComponent(it.title || '')}`;
}

/* ═══════════════════ FOCUS / TASTIERA ═══════════════════ */
function getFocusable(){
  const root = activeView === 'details'
    ? document.getElementById('details')
    : document.getElementById('view-catalog') || document.body;
  const scope = activeView === 'details'
    ? document.getElementById('details')
    : document;
  return Array.from(scope.querySelectorAll('.focusable')).filter(el => {
    const r = el.getBoundingClientRect();
    const st = window.getComputedStyle(el);
    return r.width > 0 && r.height > 0 && st.visibility !== 'hidden' && st.display !== 'none';
  });
}

function setFocus(el){
  if (!el) return;
  document.querySelectorAll('.tv-focus').forEach(x => x.classList.remove('tv-focus'));
  el.classList.add('tv-focus');
  try { el.focus({preventScroll: true}); } catch(e) {}
  el.scrollIntoView({behavior:'smooth', block:'center', inline:'nearest'});
}

function clearFocus(){
  document.querySelectorAll('.tv-focus').forEach(x => x.classList.remove('tv-focus'));
}

function moveFocus(direction){
  const elements = getFocusable();
  if (elements.length === 0) return;
  const current = document.querySelector('.tv-focus') || document.activeElement;
  if (!elements.includes(current)){
    setFocus(elements[0]);
    return;
  }
  const rect = current.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  let best = null, minDist = Infinity;
  for (const el of elements){
    if (el === current) continue;
    const r = el.getBoundingClientRect();
    const ex = r.left + r.width / 2;
    const ey = r.top + r.height / 2;
    const dx = ex - cx;
    const dy = ey - cy;
    let valid = false;
    if (direction === 'LEFT'  && dx < -8) valid = true;
    if (direction === 'RIGHT' && dx >  8) valid = true;
    if (direction === 'UP'    && dy < -8) valid = true;
    if (direction === 'DOWN'  && dy >  8) valid = true;
    if (!valid) continue;
    // distanza pesata: priorità all'asse del movimento
    let dist;
    if (direction === 'LEFT' || direction === 'RIGHT') {
      dist = Math.abs(dx) + Math.abs(dy) * 4;
    } else {
      dist = Math.abs(dy) + Math.abs(dx) * 4;
    }
    if (dist < minDist){ minDist = dist; best = el; }
  }
  if (best) setFocus(best);
}

/* ═══════════════════ FILTRI ═══════════════════ */
function buildFilters(){
  const set = new Set();
  DATA.forEach(it => getGenres(it).forEach(g => set.add(g)));
  const genres = [...set].sort();
  const bar = document.getElementById('filters');
  bar.innerHTML =
    `<button class="chip focusable ${!activeGenre?'active':''}" onclick="setGenre(null)" tabindex="0">Tutti</button>` +
    genres.map(g =>
      `<button class="chip focusable ${activeGenre===g?'active':''}" onclick="setGenre('${esc(g)}')" tabindex="0">${esc(g)}</button>`
    ).join('');
}
function setGenre(g){ activeGenre = g; buildFilters(); applyFilter(); }

/* ═══════════════════ CATALOGO ═══════════════════ */
function applyFilter(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  filtered = DATA.filter(it => {
    if (activeGenre && !getGenres(it).includes(activeGenre)) return false;
    if (q){
      const hay = (it.title + ' ' + (it.original_title||'') + ' ' +
                   (it.year||'') + ' ' + getGenres(it).join(' ')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  render();
}

function render(){
  const grid = document.getElementById('grid');
  document.getElementById('count-title').textContent =
    `Catalogo · ${filtered.length} titoli`;

  if (filtered.length === 0){
    grid.innerHTML = `<div class="empty">Nessun titolo trovato.</div>`;
    return;
  }

  grid.innerHTML = filtered.map((it, i) => {
    const poster = getPoster(it);
    const tv = it.type === 'tv';
    const typeIcon = tv ? 'fa-tv' : 'fa-film';
    return `
      <div class="card focusable" data-i="${i}" tabindex="0" onclick="openDetails(${i})">
        ${it.rating ? `<div class="badge"><i class="fas fa-star"></i>${Number(it.rating).toFixed(1)}</div>` : ''}
        <div class="type"><i class="fas ${typeIcon}"></i></div>
        <img src="${esc(poster)}" loading="lazy" alt="">
        <div class="overlay">
          ${esc(it.title)}
          ${it.year ? `<div class="year">${esc(it.year)}</div>` : ''}
        </div>
      </div>`;
  }).join('');

  // Se l'utente era sulla griglia, rimetti il focus sulla prima card
  if (activeView === 'catalog'){
    const first = document.querySelector('#grid .card');
    if (first && !document.querySelector('.tv-focus')){
      // non forzare il focus al primo render se l'utente sta navigando
    }
  }
}

/* ═══════════════════ DETAILS ═══════════════════ */
function openDetails(i){
  const it = filtered[i];
  if (!it) return;
  lastFocusedInCatalog = document.querySelector('.tv-focus');
  currentItem = it;
  currentSeasonIndex = 0;
  activeView = 'details';
  clearFocus();

  const tv = it.type === 'tv';

  const hero = document.getElementById('d-hero');
  if (it.backdrop){
    hero.style.backgroundImage = `url('${it.backdrop}')`;
  } else {
    hero.style.backgroundImage = 'none';
    hero.style.background = 'linear-gradient(135deg,#0a2015,#050505)';
  }

  document.getElementById('d-poster').src = getPoster(it);
  document.getElementById('d-title').textContent = it.title;
  document.getElementById('d-meta').innerHTML = [
    it.rating ? `<span class="tag green"><i class="fas fa-star"></i> ${Number(it.rating).toFixed(1)}</span>` : '',
    it.year ? `<span class="tag">${esc(it.year)}</span>` : '',
    `<span class="tag">${tv ? 'Serie TV' : 'Film'}</span>`,
    ...getGenres(it).map(g => `<span class="tag">${esc(g)}</span>`)
  ].filter(Boolean).join('');

  document.getElementById('d-overview').textContent = it.overview || 'Trama non disponibile.';

  const watchUrl = getWatchUrl(it);
  const hasRealEpisodes = tv && Array.isArray(it.seasons) && it.seasons.length > 0 &&
                          it.seasons.some(s => s.episodes && s.episodes.length > 0);

  let actionsHtml = `
    <button class="btn btn-primary focusable" tabindex="0"
            onclick="openExternal('${watchUrl}')">
      <i class="fas fa-play"></i> ${tv ? 'APRI SERIE' : 'GUARDA'}
    </button>`;

  if (tv && !hasRealEpisodes){
    actionsHtml += `
      <p style="color:#888;font-size:.85rem;margin-top:4px;max-width:500px;line-height:1.5;">
        <i class="fas fa-info-circle"></i>
        Stagione ed episodio li scegli nel player di StreamingCommunity.
      </p>`;
  }
  document.getElementById('d-actions').innerHTML = actionsHtml;

  const epSection = document.getElementById('ep-section');
  if (hasRealEpisodes && it.tmdb_id){
    epSection.style.display = 'block';
    loadSeasons(it);
  } else {
    epSection.style.display = 'none';
  }

  document.getElementById('details').classList.add('open');
  document.getElementById('details').scrollTop = 0;

  // Focus sul back button come punto di partenza
  setTimeout(() => {
    const backBtn = document.getElementById('back-btn');
    if (backBtn) setFocus(backBtn);
  }, 80);
}

function closeDetails(){
  document.getElementById('details').classList.remove('open');
  currentItem = null;
  currentSeasons = [];
  activeView = 'catalog';
  clearFocus();

  // Ripristina focus sulla card da cui eravamo partiti
  setTimeout(() => {
    if (lastFocusedInCatalog && document.contains(lastFocusedInCatalog)){
      setFocus(lastFocusedInCatalog);
    } else {
      const first = document.querySelector('#grid .card');
      if (first) setFocus(first);
    }
  }, 50);
}

/* ═══════════════════ STAGIONI / EPISODI ═══════════════════ */
async function loadSeasons(it){
  const bar = document.getElementById('season-bar');
  const grid = document.getElementById('ep-grid');
  bar.innerHTML = '';

  if (!Array.isArray(it.seasons) || it.seasons.length === 0){
    grid.innerHTML = '<div class="empty">Nessun episodio disponibile.</div>';
    return;
  }

  currentSeasons = it.seasons.map(s => ({
    season_number: s.season,
    episode_count: s.episodes.length,
    _local: s
  }));
  currentSeasonIndex = 0;
  renderSeasonBar(it);
  loadEpisodes(it, currentSeasons[0].season_number);
}

function renderSeasonBar(it){
  const bar = document.getElementById('season-bar');
  bar.innerHTML = currentSeasons.map((s, idx) => `
    <button class="chip focusable ${idx === currentSeasonIndex ? 'active' : ''}"
            onclick="selectSeason(${idx})" tabindex="0">
      Stagione ${s.season_number}
      <span style="opacity:.6;font-size:.72rem;">(${s.episode_count})</span>
    </button>`).join('');
}

function selectSeason(idx){
  if (idx < 0 || idx >= currentSeasons.length) return;
  currentSeasonIndex = idx;
  renderSeasonBar(currentItem);
  loadEpisodes(currentItem, currentSeasons[idx].season_number);
  setTimeout(() => {
    const activeChip = document.querySelectorAll('#season-bar .chip')[idx];
    if (activeChip) setFocus(activeChip);
  }, 50);
}

async function loadEpisodes(it, seasonNum){
  const grid = document.getElementById('ep-grid');
  const localSeason = (it.seasons || []).find(s => s.season === seasonNum);

  if (!localSeason || localSeason.episodes.length === 0){
    grid.innerHTML = '<div class="empty">Nessun episodio.</div>';
    return;
  }

  let tmdbEps = [];
  if (it.tmdb_id){
    try {
      const res = await fetch(
        `https://api.themoviedb.org/3/tv/${it.tmdb_id}/season/${seasonNum}?api_key=${TMDB_API_KEY}&language=it-IT`
      );
      const data = await res.json();
      tmdbEps = data.episodes || [];
    } catch (e) {}
  }

  grid.innerHTML = localSeason.episodes.map(ep => {
    const tmdbEp = tmdbEps.find(t => t.episode_number === ep.episode);
    const img = (tmdbEp && tmdbEp.still_path)
      ? IMG_BASE + '/w400' + tmdbEp.still_path
      : 'https://via.placeholder.com/400x225/111/666?text=E' + ep.episode;
    const name = (tmdbEp && tmdbEp.name) || ep.name || 'Episodio ' + ep.episode;
    const desc = (tmdbEp && tmdbEp.overview) || '';
    const epUrl = ep.watch_url || `${SC_BASE}/it/watch/${it.sc_id}?e=${ep.id}`;
    return `
      <div class="ep-card focusable" tabindex="0" onclick="openExternal('${epUrl}')">
        <div class="ep-thumb">
          <img src="${img}" loading="lazy" alt="">
          <div class="ep-badge">E${ep.episode}</div>
          <div class="ep-play"><i class="fas fa-play-circle"></i></div>
        </div>
        <div class="ep-info">
          <div class="ep-title">${esc(name)}</div>
          <div class="ep-desc">${esc(desc || '...')}</div>
        </div>
      </div>`;
  }).join('');
}

/* ═══════════════════ TASTIERA ═══════════════════ */
document.addEventListener('keydown', (e) => {
  const key = e.key;

  // Se l'utente sta scrivendo nella search
  const input = document.getElementById('search');
  const isTyping = document.activeElement === input;

  // ENTER: attiva l'elemento con focus
  if (key === 'Enter'){
    if (isTyping){
      // dalla search: vai al primo risultato
      const first = document.querySelector('#grid .card');
      if (first){
        e.preventDefault();
        setFocus(first);
      }
      return;
    }
    const focused = document.querySelector('.tv-focus');
    if (focused){
      e.preventDefault();
      focused.click();
    }
    return;
  }

  // ESC / BACKSPACE / Back: chiudi details o torna indietro
  if (key === 'Escape' || key === 'Backspace'){
    if (isTyping) return; // lascia funzionare backspace nella search
    if (activeView === 'details'){
      e.preventDefault();
      closeDetails();
    }
    return;
  }

  // FRECCE
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(key)){
    // Se sei nella search, lascia muovere il cursore
    if (isTyping){
      if (key === 'ArrowDown'){
        e.preventDefault();
        input.blur();
        const first = document.querySelector('#grid .card');
        if (first) setFocus(first);
        return;
      }
      return;
    }
    e.preventDefault();
    if (key === 'ArrowLeft')  moveFocus('LEFT');
    if (key === 'ArrowRight') moveFocus('RIGHT');
    if (key === 'ArrowUp')    moveFocus('UP');
    if (key === 'ArrowDown')  moveFocus('DOWN');
    return;
  }
});

/* ═══════════════════ SEARCH ═══════════════════ */
document.getElementById('search').addEventListener('input', () => applyFilter());

/* ═══════════════════ BOOT ═══════════════════ */
function boot(){
  if (!DATA.length){
    document.getElementById('grid').innerHTML = `
      <div class="empty">Nessun dato in <code>data.js</code>.<br>
      Esegui <code>python build_vod_map.py</code> e ricarica.</div>`;
    return;
  }
  buildFilters();
  applyFilter();

  // Focus iniziale sulla prima card
  setTimeout(() => {
    const first = document.querySelector('#grid .card');
    if (first) setFocus(first);
  }, 150);
}
boot();
</script>
