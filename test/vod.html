<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>StreamUI · VOD</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Quicksand:wght@600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --jf-bg: #101010; --jf-accent: #00A4DC;
  --jf-gradient-start: #AA5CC3; --jf-gradient-end: #00A4DC;
  --surface-1: #181818; --surface-2: #212121; --surface-3: #2a2a2a;
  --border-soft: rgba(255,255,255,0.08);
  --text-primary: #f0f0f0; --text-secondary: #a0a0a0; --text-muted: #6b6b6b;
  --radius-sm: 8px; --radius: 12px; --radius-lg: 18px;
  --header-h: 68px;
  --accent-glow: 0 0 24px rgba(0,164,220,0.25);
  --card-shadow: 0 12px 32px rgba(0,0,0,0.55);
  --font-body: 'Inter', system-ui, sans-serif;
  --font-display: 'Quicksand', 'Inter', sans-serif;
  --focus-ring: 0 0 0 3px var(--jf-accent), 0 0 24px rgba(0,164,220,0.4);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--jf-bg); color: var(--text-primary); font-family: var(--font-body); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
::selection { background: var(--jf-accent); color: #000; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: var(--header-h); display: flex; align-items: center; gap: 20px; padding: 0 32px; background: rgba(16,16,16,0.72); backdrop-filter: blur(18px) saturate(140%); border-bottom: 1px solid var(--border-soft); }
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 1.45rem; font-weight: 700; white-space: nowrap; user-select: none; }
.logo-mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--jf-gradient-start), var(--jf-gradient-end)); display: grid; place-items: center; font-size: 1rem; color: #000B25; font-weight: 800; flex-shrink: 0; }
.logo-text { background: linear-gradient(135deg, var(--jf-gradient-start), var(--jf-gradient-end)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.header-search { flex: 1; max-width: 440px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: 999px; transition: border-color 0.2s, box-shadow 0.2s; cursor: text; }
.header-search:focus-within, .header-search.focused { border-color: var(--jf-accent); box-shadow: var(--accent-glow); }
.header-search input { flex: 1; background: none; border: none; outline: none; color: var(--text-primary); font-size: 0.9rem; }
.header-search input::placeholder { color: var(--text-muted); }

#hero { position: relative; height: 88vh; min-height: 560px; display: flex; align-items: flex-end; overflow: hidden; }
#hero-backdrop { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 22%; }
#hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, var(--jf-bg) 0%, rgba(16,16,16,0.92) 16%, rgba(16,16,16,0.35) 50%, rgba(16,16,16,0.05) 100%), linear-gradient(to right, rgba(16,16,16,0.55) 0%, transparent 55%); pointer-events: none; }
#hero-content { position: relative; z-index: 2; padding: 0 48px 80px; max-width: 760px; }
#hero-title { font-family: var(--font-display); font-size: clamp(2.6rem, 5.2vw, 4.4rem); font-weight: 700; line-height: 1.03; margin-bottom: 14px; text-shadow: 0 4px 30px rgba(0,0,0,0.7); }
#hero-meta { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 18px; }
.rating-pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; background: rgba(0,164,220,0.15); color: var(--jf-accent); font-weight: 700; font-size: 0.82rem; border: 1px solid rgba(0,164,220,0.25); }
#hero-overview { color: #cfcfcf; font-size: 1rem; line-height: 1.65; margin-bottom: 28px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 1px 12px rgba(0,0,0,0.6); }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 24px; border-radius: 999px; font-size: 0.9rem; font-weight: 700; transition: transform 0.18s, background 0.2s, box-shadow 0.2s; white-space: nowrap; outline: none; }
.btn:active { transform: scale(0.96); }
.btn-primary { background: var(--jf-accent); color: #001018; box-shadow: 0 4px 20px rgba(0,164,220,0.35); }
.btn-primary:hover, .btn-primary.focused { background: #33b7e6; box-shadow: 0 6px 28px rgba(0,164,220,0.55), var(--focus-ring); }
.btn-ghost { background: rgba(255,255,255,0.08); color: var(--text-primary); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(8px); }
.btn-ghost:hover, .btn-ghost.focused { background: rgba(255,255,255,0.18); box-shadow: var(--focus-ring); }
.btn-ghost.is-fav { background: rgba(224,76,76,0.18); border-color: rgba(224,76,76,0.5); color: #ff8888; }
.btn-ghost.is-fav:hover,
.btn-ghost.is-fav.focused { background: rgba(224,76,76,0.3); box-shadow: 0 0 0 3px rgba(224,76,76,0.4), 0 0 24px rgba(224,76,76,0.3); }

main { position: relative; z-index: 3; padding-bottom: 100px; min-height: 40vh; }

/* ▼ OTTIMIZZAZIONE: content-visibility per righe fuori viewport */
.row-section {
  margin-bottom: 40px;
  content-visibility: auto;
  contain-intrinsic-size: auto 380px;
}

.row-header { display: flex; align-items: baseline; justify-content: space-between; padding: 0 48px; margin-bottom: 14px; }
.row-title { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; }
.row-scroll { display: flex; gap: 14px; overflow-x: auto; padding: 6px 48px 18px; scroll-behavior: smooth; scrollbar-width: none; }
.row-scroll::-webkit-scrollbar { display: none; }

.card { flex: 0 0 auto; width: 184px; overflow: hidden; background: var(--surface-1); position: relative; cursor: pointer; transition: transform 0.22s cubic-bezier(.2,.8,.3,1), box-shadow 0.22s; outline: 2px solid transparent; outline-offset: 2px; }
.card:hover {box-shadow: var(--card-shadow); z-index: 4; }
.card.focused { box-shadow: var(--focus-ring), var(--card-shadow); z-index: 6; outline-color: var(--jf-accent); }
.card-poster { position: relative; width: 100%; aspect-ratio: 2/3; background: var(--surface-2); overflow: hidden; }
.card-poster img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
.card:hover .card-poster img { transform: scale(1.04); }
.card-badge-rating { position: absolute; top: 8px; left: 8px; padding: 3px 7px; border-radius: 6px; background: rgba(0,0,0,0.72); backdrop-filter: blur(6px); font-size: 0.68rem; font-weight: 800; color: var(--jf-accent); border: 1px solid rgba(0,164,220,0.3); }
.card-type-badge { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 6px; background: rgba(0,0,0,0.72); backdrop-filter: blur(6px); display: grid; place-items: center; font-size: 0.72rem; color: var(--jf-accent); border: 1px solid rgba(0,164,220,0.3); }
.card-caption { padding: 10px 10px 12px; }
.card-caption h3 { font-size: 0.82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-caption p { font-size: 0.72rem; color: var(--text-muted); margin-top: 3px; }

.card-remove-btn {
  position: absolute; bottom: 8px; right: 8px;
  width: 26px; height: 26px; border-radius: 50%;
  background: rgba(0,0,0,0.75); backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.22);
  display: grid; place-items: center;
  font-size: 0.72rem; font-weight: 700; color: #fff;
  cursor: pointer; z-index: 7; transition: all 0.18s;
  opacity: 0.65;
}
.card:hover .card-remove-btn,
.card.focused .card-remove-btn { opacity: 1; }
.card-remove-btn:hover,
.card-remove-btn:focus-visible {
  background: #e04c4c; border-color: #e04c4c;
  box-shadow: 0 0 14px rgba(224,76,76,0.65);
  outline: none;
}

.card-remove-hint {
  position: absolute; bottom: 8px; left: 8px;
  padding: 4px 8px; border-radius: 6px;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(6px);
  border: 1px solid rgba(224,76,76,0.5);
  font-size: 0.56rem; font-weight: 700; color: #ff8888;
  letter-spacing: 0.2px; white-space: nowrap;
  opacity: 0; transition: opacity 0.2s;
  pointer-events: none; z-index: 7;
}
.card.focused .card-remove-hint { opacity: 1; }
.card.holding .card-remove-hint { opacity: 0; }

.card-poster::before {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, #e04c4c, #ff6666);
  transform: scaleX(0); transform-origin: left;
  z-index: 5; pointer-events: none;
  border-radius: 0 0 4px 4px;
}
.card.holding .card-poster::before {
  animation: holdFill 800ms linear forwards;
}
@keyframes holdFill {
  from { transform: scaleX(0); }
  to   { transform: scaleX(1); }
}

#detail-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.78); backdrop-filter: blur(10px); display: none; align-items: flex-start; justify-content: center; padding: 32px 20px 60px; overflow-y: auto; opacity: 0; transition: opacity 0.3s; }
#detail-overlay.open { display: flex; opacity: 1; }
#detail-modal { background: var(--surface-1); border-radius: var(--radius-lg); width: min(980px, 100%); max-height: 92vh; position: relative; border: 1px solid var(--border-soft); box-shadow: 0 30px 80px rgba(0,0,0,0.7); transform: translateY(24px) scale(0.985); transition: transform 0.35s cubic-bezier(.2,.8,.3,1); overflow-y: auto; }
#detail-overlay.open #detail-modal { transform: translateY(0) scale(1); }
#detail-close { position: absolute; top: 16px; right: 16px; z-index: 10; width: 38px; height: 38px; border-radius: 50%; background: rgba(0,0,0,0.65); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.18); color: #fff; font-size: 1.1rem; display: grid; place-items: center; }
#detail-close:hover, #detail-close.focused { background: var(--jf-accent); color: #001018; box-shadow: var(--focus-ring); }
#detail-backdrop { width: 100%; height: 360px; object-fit: cover; object-position: center 25%; mask-image: linear-gradient(to bottom, #000 45%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, #000 45%, transparent 100%); }
#detail-body { padding: 0 40px 40px; margin-top: -90px; position: relative; }
#detail-title { font-family: var(--font-display); font-size: 2rem; font-weight: 700; margin-bottom: 10px; line-height: 1.1; }
#detail-meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 18px; }
#detail-overview { color: #c8c8c8; line-height: 1.7; font-size: 0.95rem; margin-bottom: 26px; max-width: 760px; }
#detail-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.detail-section-title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; margin: 28px 0 14px; }

#detail-cast { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
#detail-cast::-webkit-scrollbar { display: none; }
.cast-card { flex: 0 0 auto; width: 88px; text-align: center; }
.cast-card img { width: 68px; height: 68px; border-radius: 50%; object-fit: cover; margin: 0 auto 7px; background: var(--surface-2); border: 2px solid var(--border-soft); }
.cast-card .name { font-size: 0.74rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cast-card .role { font-size: 0.66rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#detail-trailer iframe { width: 100%; aspect-ratio: 16/9; border: none; border-radius: var(--radius); background: #000; }

.season-chips-wrap { margin: 22px 0 18px; }
.season-chips-label { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px; display: block; }
.season-chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; scroll-behavior: smooth; }
.season-chips::-webkit-scrollbar { display: none; }
.season-chip { flex: 0 0 auto; height: 36px; padding: 0 16px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border-soft); color: var(--text-secondary); font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; outline: 2px solid transparent; outline-offset: 2px; white-space: nowrap; }
.season-chip:hover { background: var(--surface-3); color: var(--text-primary); }
.season-chip.active { background: rgba(0,164,220,0.15); color: var(--jf-accent); border-color: rgba(0,164,220,0.4); }
.season-chip.focused { box-shadow: var(--focus-ring); border-color: var(--jf-accent); color: var(--text-primary); }
.season-chip .count { opacity: 0.6; font-size: 0.72rem; }

#episodes-list { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.episode-item { display: flex; gap: 16px; padding: 12px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid transparent; cursor: pointer; transition: all 0.2s; outline: 2px solid transparent; outline-offset: 2px; }
.episode-item:hover { border-color: rgba(0,164,220,0.3); background: var(--surface-3); }
.episode-item.focused { border-color: var(--jf-accent); box-shadow: var(--focus-ring); }
.episode-still { flex: 0 0 140px; aspect-ratio: 16/9; border-radius: var(--radius-sm); overflow: hidden; background: var(--surface-3); }
.episode-still img { width: 100%; height: 100%; object-fit: cover; }
.episode-number-box { flex: 0 0 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--surface-3); border-radius: var(--radius-sm); padding: 12px 6px; }
.episode-number-box .num { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; color: var(--jf-accent); line-height: 1; }
.episode-number-box .label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
.episode-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.episode-name { font-size: 0.95rem; font-weight: 700; margin-bottom: 5px; }
.episode-overview { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ep-info-msg { color: var(--text-muted); font-size: 0.85rem; padding: 14px; background: var(--surface-2); border-radius: var(--radius); border-left: 3px solid var(--jf-accent); }
.loading-ep { color: var(--text-muted); padding: 16px; font-size: 0.85rem; }

.empty-state { padding: 80px 48px; text-align: center; color: var(--text-muted); }
.empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.4; }
.empty-state h3 { color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 6px; }
.view-header { padding: 120px 48px 24px; }
.view-header h1 { font-family: var(--font-display); font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
.view-header p { color: var(--text-muted); font-size: 0.9rem; }

@media (max-width: 900px) {
  header { padding: 0 16px; gap: 12px; }
  .header-search { max-width: 260px; }
  #hero-content { padding: 0 20px 60px; }
  .row-header { padding: 0 20px; }
  .row-scroll { padding: 6px 20px 16px; gap: 12px; }
  .card { width: 150px; }
  .row-section { contain-intrinsic-size: auto 320px; }
  #detail-body { padding: 0 22px 28px; }
  #detail-backdrop { height: 260px; }
  #detail-title { font-size: 1.55rem; }
  .view-header { padding: 100px 20px 20px; }
}
@media (max-width: 560px) {
  :root { --header-h: 60px; }
  .logo-text { display: none; }
  .header-search { max-width: none; }
  #hero { height: 82vh; min-height: 480px; }
  #hero-title { font-size: 2.1rem; }
  #hero-overview { font-size: 0.9rem; -webkit-line-clamp: 2; }
  .btn { height: 40px; padding: 0 18px; font-size: 0.82rem; }
  .episode-item { flex-direction: column; }
  .episode-still { flex: none; width: 100%; }
  .episode-number-box { flex: none; flex-direction: row; gap: 8px; padding: 8px; }
}
.hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">▶</div>
    <span class="logo-text">NeroCommunity</span>
  </div>
  <div class="header-search" id="search-wrap" tabindex="0" onclick="onSearchWrapClick(event)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="search" type="search" placeholder="Cerca nel catalogo..." autocomplete="off"
           inputmode="search" autocapitalize="off" autocorrect="off" spellcheck="false" />
  </div>
</header>

<section id="hero">
  <img id="hero-backdrop" alt="" class="hidden" />
  <div id="hero-content">
    <div id="hero-text" class="hidden">
      <h1 id="hero-title"></h1>
      <div id="hero-meta"></div>
      <p id="hero-overview"></p>
      <div class="hero-actions">
        <button class="btn btn-primary" id="hero-play">▶ Play</button>
        <button class="btn btn-ghost" id="hero-info">ℹ Più informazioni</button>
      </div>
    </div>
  </div>
</section>

<main id="app"></main>

<div id="detail-overlay">
  <div id="detail-modal">
    <button id="detail-close" aria-label="Chiudi">✕</button>
    <img id="detail-backdrop" alt="" style="display:none;" />
    <div id="detail-body">
      <h2 id="detail-title"></h2>
      <div id="detail-meta"></div>
      <p id="detail-overview"></p>
      <div id="detail-actions"></div>
      <div id="detail-trailer"></div>
      <div id="season-container" class="hidden">
        <div class="season-chips-wrap">
          <span class="season-chips-label">Stagione</span>
          <div class="season-chips" id="season-chips"></div>
        </div>
        <div id="episodes-list"></div>
      </div>
      <h3 class="detail-section-title">Cast principale</h3>
      <div id="detail-cast"></div>
    </div>
  </div>
</div>

<script src="catalog.js"></script>

<script>
/* ═══════════ CONFIG ═══════════ */
const TMDB_KEY = '56dd0eb5ddacfa471fda68c68a550eb1';
const TMDB_API = 'https://api.themoviedb.org/3';
const TMDB_LANG = 'it-IT';
const IMG = (path, size = 'w500') => path ? `https://image.tmdb.org/t/p/${size}${path}` : null;
const SC_BASE = 'https://streamingcommunityz.build';
const NO_POSTER = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MDAiIGhlaWdodD0iNzUwIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMTgxODE4Ii8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZpbGw9IiM0NDQiIGZvbnQtc2l6ZT0iMjAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5ObyBQb3N0ZXI8L3RleHQ+PC9zdmc+';
const NO_AVATAR = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxODUiIGhlaWdodD0iMTg1Ij48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMjEyMTIxIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZpbGw9IiM0NDQiIGZvbnQtc2l6ZT0iMTQiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5ObyBJbWFnZTwvdGV4dD48L3N2Zz4=';

/* ═══════════ UTILITY ═══════════ */
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openExternal(url){ window.open(url,'_blank','noopener,noreferrer'); }

/* ▼ OTTIMIZZAZIONE: poster ridimensionati alla dimensione reale della card */
function resizePoster(url, size = 'w342') {
  if (!url) return NO_POSTER;
  if (url.startsWith('data:')) return url;
  return url.replace(/\/t\/p\/[^/]+\//, `/t/p/${size}/`);
}

/* ═══════════ CATALOG ═══════════ */
let CATALOG = [];
let HERO_POOL = [];   /* ▼ OTTIMIZZAZIONE: precomputato una volta sola */

async function loadCatalog(){
  if (window.CATALOG_DATA && window.CATALOG_DATA.items){
    CATALOG = window.CATALOG_DATA.items;
    console.log('[catalog] da catalog.js:', CATALOG.length, 'titoli');
    return;
  }
  try {
    const res = await fetch('catalog.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    CATALOG = data.items || [];
    console.log('[catalog] da catalog.json:', CATALOG.length, 'titoli');
  } catch(e){
    console.error('Errore caricamento catalogo:', e.message);
    CATALOG = [];
  }
}

function getScUrl(item){
  if (item.sc_id) return `${SC_BASE}/it/watch/${item.sc_id}`;
  return `${SC_BASE}/it/search?q=${encodeURIComponent(item.title || '')}`;
}

/* ═══════════ PREFERITI & RECENTI ═══════════ */
const FAV_KEY = 'streamui_favorites_v1';
const RECENT_KEY = 'streamui_recent_v1';
const RECENT_LIMIT = 20;

let favorites = [];
let recents = [];
let homeDirty = false;

function itemKey(item){ return `${item.type}_${item.tmdb_id}`; }

function stripItem(item){
  return {
    type: item.type, tmdb_id: item.tmdb_id,
    title: item.title, original_title: item.original_title,
    year: item.year, rating: item.rating,
    poster: item.poster, backdrop: item.backdrop,
    overview: item.overview, genres: item.genres,
    sc_id: item.sc_id
  };
}

function loadUserData(){
  const catIds = new Set(CATALOG.map(x => itemKey(x)));
  try {
    favorites = (JSON.parse(localStorage.getItem(FAV_KEY) || '[]'))
      .filter(x => catIds.has(itemKey(x)));
  } catch(e){ favorites = []; }
  try {
    recents = (JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'))
      .filter(x => catIds.has(itemKey(x)));
  } catch(e){ recents = []; }
}

function saveFavorites(){ try { localStorage.setItem(FAV_KEY, JSON.stringify(favorites)); } catch(e){} }
function saveRecents(){ try { localStorage.setItem(RECENT_KEY, JSON.stringify(recents)); } catch(e){} }

function isFavorite(item){ return favorites.some(x => itemKey(x) === itemKey(item)); }
function isRecent(item){ return recents.some(x => itemKey(x) === itemKey(item)); }

function toggleFavorite(item){
  const key = itemKey(item);
  const idx = favorites.findIndex(x => itemKey(x) === key);
  if (idx >= 0) favorites.splice(idx, 1);
  else favorites.unshift(stripItem(item));
  saveFavorites();
  updateDetailActions(item);
  refreshHomeAfterChange();
}

function removeFavorite(item){
  const key = itemKey(item);
  const idx = favorites.findIndex(x => itemKey(x) === key);
  if (idx >= 0){ favorites.splice(idx, 1); saveFavorites(); }
  updateDetailActions(item);
  refreshHomeAfterChange();
}

function addToRecent(item){
  const key = itemKey(item);
  const idx = recents.findIndex(x => itemKey(x) === key);
  if (idx >= 0) recents.splice(idx, 1);
  recents.unshift(stripItem(item));
  if (recents.length > RECENT_LIMIT) recents.length = RECENT_LIMIT;
  saveRecents();
  updateDetailActions(item);
  refreshHomeAfterChange();
}

function removeFromRecent(item){
  const key = itemKey(item);
  const idx = recents.findIndex(x => itemKey(x) === key);
  if (idx >= 0){ recents.splice(idx, 1); saveRecents(); }
  updateDetailActions(item);
  refreshHomeAfterChange();
}

function refreshHomeAfterChange(){
  if (currentView !== 'home') return;
  if (isDetailOpen){ homeDirty = true; return; }
  rebuildHomePreservingFocus();
}

function rebuildHomePreservingFocus(){
  const wasHeroFocused = heroFocusIndex >= 0;
  const prevHeroIndex = heroFocusIndex;
  const prevRow = focusedRow;
  const prevCol = focusedCol;
  const prevItem = rows[prevRow] && rows[prevRow].items ? rows[prevRow].items[prevCol] : null;
  const prevKey = prevItem ? itemKey(prevItem) : null;
  const scrollY = window.scrollY;

  renderHome({ skipHeroFocus: true });

  window.scrollTo(0, scrollY);

  if (wasHeroFocused){
    setHeroFocus(prevHeroIndex);
    return;
  }

  if (prevKey){
    for (let r = 0; r < rows.length; r++){
      const c = rows[r].items.findIndex(it => itemKey(it) === prevKey);
      if (c >= 0){ setFocus(r, c); return; }
    }
  }

  if (rows.length > 0){
    let r = Math.min(prevRow, rows.length - 1);
    while (r >= 0 && (!rows[r].items || rows[r].items.length === 0)) r--;
    if (r < 0){
      for (r = 0; r < rows.length; r++){
        if (rows[r].items && rows[r].items.length > 0) break;
      }
    }
    if (r < 0 || !rows[r].items || rows[r].items.length === 0){
      setHeroFocus(0);
      return;
    }
    const maxCol = rows[r].items.length - 1;
    setFocus(r, Math.min(prevCol, Math.max(0, maxCol)));
  } else {
    setHeroFocus(0);
  }
}

/* ═══════════ HERO GIORNALIERO ═══════════ */
function pickHero(){
  if (HERO_POOL.length === 0) HERO_POOL = CATALOG.filter(x => x.backdrop);
  if (HERO_POOL.length === 0) return null;

  let lastKey = null;
  try { lastKey = localStorage.getItem('hero_last_v6'); } catch(e) {}

  // 50% chance: un titolo dai recenti (escluso l'ultimo mostrato)
  const recentPool = recents.filter(r => r.backdrop && itemKey(r) !== lastKey);
  const useRecent = recentPool.length > 0 && Math.random() < 0.5;

  let chosen;
  if (useRecent) {
    const pick = recentPool[Math.floor(Math.random() * recentPool.length)];
    chosen = CATALOG.find(x => itemKey(x) === itemKey(pick)) || pick;
  } else {
    let pool = HERO_POOL.filter(x => itemKey(x) !== lastKey);
    if (!pool.length) pool = HERO_POOL;
    chosen = pool[Math.floor(Math.random() * pool.length)];
  }

  try { localStorage.setItem('hero_last_v6', itemKey(chosen)); } catch(e) {}
  return chosen;
}

function createCard(item, rowIndex, colIndex, options = {}){
  const tv = item.type === 'tv';

  const card = document.createElement('div');

  card.dataset.col = colIndex;

  const poster = document.createElement('div');
  poster.className = 'card-poster';

  img.src = resizePoster(item.poster, 'w342');   /* ▼ OTTIMIZZAZIONE */
  img.decoding = 'async';                        /* ▼ OTTIMIZZAZIONE */
  img.alt = item.title || '';
  img.loading = 'lazy';
  img.onerror = () => { img.src = NO_POSTER; };
  poster.appendChild(img);

  if (rating){
    const rb = document.createElement('div');
    rb.className = 'card-badge-rating';
    rb.textContent = `★ ${rating}`;
    poster.appendChild(rb);
  }
  const typeBadge = document.createElement('div');
  typeBadge.className = 'card-type-badge';
  typeBadge.textContent = tv ? '📺' : '🎬';

    const hint = document.createElement('div');
    hint.className = 'card-remove-hint';
    hint.textContent = 'Tieni premuto OK';
    hint.title = 'Tieni premuto OK per rimuovere';
    poster.appendChild(hint);

    const rm = document.createElement('button');
    rm.type = 'button';
    rm.className = 'card-remove-btn';
    rm.innerHTML = '✕';
    rm.title = options.removeLabel || 'Rimuovi';
    rm.setAttribute('aria-label', options.removeLabel || 'Rimuovi');
    rm.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      if (options.onRemove) options.onRemove(item);
    });

  }

  card.appendChild(poster);

  const cap = document.createElement('div');

  cap.appendChild(h3);
  cap.appendChild(p);
  card.appendChild(cap);

  card.addEventListener('click', () => {

/* ═══════════ ROW — usato solo da search (riga singola, sempre materializzata) ═══════════ */
function renderRow(rowConfig, index){
  const { title, items, type } = rowConfig;
  const section = document.createElement('section');
  section.className = 'row-section';
  section.dataset.rowIndex = index;
  section.dataset.rendered = '1';
  const header = document.createElement('div');
  header.className = 'row-header';
  header.innerHTML = `<h2 class="row-title">${esc(title)}</h2>`;
  section.appendChild(header);
  const row = document.createElement('div');
  row.className = 'row-scroll';
  row.dataset.rowIndex = index;

  const isDynamic = (type === 'fav' || type === 'recent');

  if (!items || items.length === 0){
    row.innerHTML = '<p style="color:var(--text-muted);padding:16px 0;font-size:0.9rem;">Nessun contenuto.</p>';
  } else {
    const frag = document.createDocumentFragment();
    items.forEach((it, i) => frag.appendChild(createCard(it, index, i, {
      showRemove: isDynamic,
      removeLabel: type === 'fav' ? 'Rimuovi dai preferiti' : 'Rimuovi dai recenti',
      onRemove: type === 'fav' ? removeFavorite : removeFromRecent
    })));
    row.appendChild(frag);
  }
  section.appendChild(row);
  return section;
}

/* ═══════════ ▼▼▼ LAZY ROW MATERIALIZATION ▼▼▼ ═══════════ */
const rowObserver = new IntersectionObserver((entries) => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    const section = entry.target;
    const idx = parseInt(section.dataset.rowIndex, 10);
    materializeRow(idx, section);
    rowObserver.unobserve(section);
  }
}, { rootMargin: '600px 0px 600px 0px', threshold: 0 });

function buildRowShell(def, index){
  const section = document.createElement('section');
  section.className = 'row-section';
  section.dataset.rowIndex = index;
  section.dataset.rendered = '0';
  const header = document.createElement('div');
  header.className = 'row-header';
  const title = document.createElement('h2');
  title.className = 'row-title';
  title.textContent = def.title;
  header.appendChild(title);
  section.appendChild(header);
  const row = document.createElement('div');
  row.className = 'row-scroll';
  row.dataset.rowIndex = index;
  section.appendChild(row);
  return section;
}

function materializeRow(index, section){
  if (!section){
    section = document.querySelector(`.row-section[data-row-index="${index}"]`);
  }
  if (!section || section.dataset.rendered === '1') return;
  section.dataset.rendered = '1';

  const def = rows[index];
  const rowEl = section.querySelector('.row-scroll');
  if (!rowEl) return;

  if (!def || !def.items || def.items.length === 0){
    rowEl.innerHTML = '<p style="color:var(--text-muted);padding:16px 0;font-size:0.9rem;">Nessun contenuto.</p>';
    return;
  }

  const isDynamic = (def.type === 'fav' || def.type === 'recent');
  const frag = document.createDocumentFragment();
  def.items.forEach((it, i) => {
    frag.appendChild(createCard(it, index, i, {
      showRemove: isDynamic,
      removeLabel: def.type === 'fav' ? 'Rimuovi dai preferiti' : 'Rimuovi dai recenti',
      onRemove: def.type === 'fav' ? removeFavorite : removeFromRecent
    }));
  });
  rowEl.appendChild(frag);
}

/* ═══════════ HOME ═══════════ */
function renderHome(opts = {}){
  homeDirty = false;
  currentView = 'home';
  heroFocusIndex = -1;
  document.getElementById('hero').style.display = '';
  const app = document.getElementById('app');
  app.innerHTML = '';
  rows = [];
  focusedRow = 0;
  focusedCol = 0;

  if (CATALOG.length === 0){
    document.getElementById('hero').style.display = 'none';
    app.innerHTML = `
      <div class="empty-state">
        <div class="icon">📭</div>
        <h3>Catalogo vuoto</h3>
        <p>Genera <code>catalog.js</code> con <code>python build_sc_map.py</code></p>
        <p style="font-size:0.75rem;margin-top:12px;color:#444;">
          Apri la console (F12) per vedere l'errore esatto.
        </p>
      </div>`;
    return;
  }

  const HOME_ROW_LIMIT = 10;
  const movies = CATALOG.filter(x => x.type === 'movie').slice(0, HOME_ROW_LIMIT);
  const tvShows = CATALOG.filter(x => x.type === 'tv').slice(0, HOME_ROW_LIMIT);
  const rowDefs = [];

  if (favorites.length > 0){
    rowDefs.push({ title: '❤ I tuoi preferiti', items: favorites.slice(), type: 'fav' });
  }
  if (recents.length > 0){
    rowDefs.push({ title: '🕒 Visti di recente', items: recents.slice(), type: 'recent' });
  }

  if (movies.length > 0) rowDefs.push({ title: '🎬 Film', items: movies });
  if (tvShows.length > 0) rowDefs.push({ title: '📺 Serie TV', items: tvShows });

  const genreMap = {};
  CATALOG.forEach(it => {
    (it.genres || []).forEach(g => {
      if (!genreMap[g]) genreMap[g] = { movies: [], tv: [] };
      if (it.type === 'movie') genreMap[g].movies.push(it);
      else genreMap[g].tv.push(it);
    });
  });

  const genreEntries = Object.entries(genreMap)
    .filter(([g, m]) => m.movies.length + m.tv.length >= 3)
    .map(([g, m]) => {
      const both = (m.movies.length > 0 && m.tv.length > 0) ? 1000 : 0;
      return { genre: g, ...m, score: both + m.movies.length + m.tv.length };
    })
    .sort((a, b) => b.score - a.score)
    .slice(0, 6);

  const PER_TYPE_LIMIT = Math.ceil(HOME_ROW_LIMIT / 2); // 5 per tipo → max 10 misti per genere

  genreEntries.forEach(({ genre, movies, tv }) => {
    const chosenMovies = movies.slice(0, PER_TYPE_LIMIT);
    const chosenTv = tv.slice(0, PER_TYPE_LIMIT);
    const mixed = [];
    const maxLen = Math.max(chosenMovies.length, chosenTv.length);
    for (let i = 0; i < maxLen; i++) {
      if (chosenMovies[i]) mixed.push(chosenMovies[i]);
      if (chosenTv[i]) mixed.push(chosenTv[i]);
    }
    if (mixed.length >= 3) {
      rowDefs.push({ title: `🎭 ${genre}`, items: mixed, type: 'genre' });
    }
  });

  /* 1. Push dei dati (leggero) */
  rowDefs.forEach((def) => {
    rows.push({ title: def.title, items: def.items, type: def.type });
  });

  /* 2. Shell DOM (senza card) + observer */
  rowDefs.forEach((_, idx) => {
    const section = buildRowShell(rows[idx], idx);
    app.appendChild(section);
    rowObserver.observe(section);
  });

  /* 3. Materializza subito le prime 2 righe (sopra la piega) */
  for (let i = 0; i < Math.min(2, rows.length); i++){
    const sec = app.querySelector(`.row-section[data-row-index="${i}"]`);
    if (sec) materializeRow(i, sec);
  }

  /* ▼ OTTIMIZZAZIONE: pool hero precomputato */
  if (HERO_POOL.length === 0){
    HERO_POOL = CATALOG.filter(x => x.backdrop);
  }
  const heroCandidate = pickHero();
  if (heroCandidate){
    heroItem = heroCandidate;
    renderHero(heroCandidate);
  }

  if (!opts.skipHeroFocus){
    setTimeout(() => setHeroFocus(0), 150);
  }
}

function renderHero(item){
  const backdrop = document.getElementById('hero-backdrop');
  const text = document.getElementById('hero-text');
  if (item.backdrop){
    backdrop.src = item.backdrop;
    backdrop.classList.remove('hidden');
  } else {
    backdrop.classList.add('hidden');
  }
  text.classList.remove('hidden');
  const tv = item.type === 'tv';
  const rating = item.rating ? Number(item.rating).toFixed(1) : 'N/D';

/* ═══════════ FOCUS ═══════════ */
function setFocus(rowIndex, colIndex){
  searchFocused = false;
  searchWrapEl.classList.remove('focused');
  heroFocusIndex = -1;
  getHeroButtons().forEach(b => b.classList.remove('focused'));
  if (!rows[rowIndex]) return;
  const row = rows[rowIndex];
  const maxCol = row.items.length - 1;
  if (maxCol < 0) return;

  /* ▼ OTTIMIZZAZIONE: materializza on-demand la riga target */
  const section = document.querySelector(`.row-section[data-row-index="${rowIndex}"]`);
  if (section && section.dataset.rendered !== '1') materializeRow(rowIndex, section);

  focusedRow = rowIndex;
  focusedCol = Math.max(0, Math.min(colIndex, maxCol));
  document.querySelectorAll('.card.focused').forEach(c => c.classList.remove('focused'));
  const card = document.querySelector(`.card[data-row="${focusedRow}"][data-col="${focusedCol}"]`);
  if (card){
    card.classList.add('focused');
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    lastFocusedCard = card;
  }
}

function moveFocus(direction){
  if (isDetailOpen) return;

  if (heroFocusIndex >= 0){
    if (direction === 'down'){
      heroFocusIndex = -1;
      getHeroButtons().forEach(b => b.classList.remove('focused'));
      for (let i = 0; i < rows.length; i++){
        if (rows[i].items.length > 0){ setFocus(i, 0); return; }
      }
      return;
    }
    if (direction === 'up'){ heroFocusIndex = -1; getHeroButtons().forEach(b => b.classList.remove('focused')); setSearchFocus(); return; }
    if (direction === 'left' && heroFocusIndex > 0) return setHeroFocus(heroFocusIndex - 1);
    if (direction === 'right' && heroFocusIndex < 1) return setHeroFocus(heroFocusIndex + 1);
    return;
  }

  if (searchFocused){
    if (direction === 'down'){
      searchWrapEl.classList.remove('focused');
      searchFocused = false;
      setHeroFocus(0);
    }
    return;
  }

  if (rows.length === 0) return;

  if (direction === 'up'){
    if (focusedRow === 0){ setHeroFocus(0); return; }
    focusedRow--; focusedCol = 0; setFocus(focusedRow, focusedCol);
  } else if (direction === 'down'){
    if (focusedRow < rows.length - 1){ focusedRow++; focusedCol = 0; setFocus(focusedRow, focusedCol); }
  } else if (direction === 'left'){
    if (focusedCol > 0) setFocus(focusedRow, focusedCol - 1);
  } else if (direction === 'right'){
    const row = rows[focusedRow];
    if (focusedCol < row.items.length - 1) setFocus(focusedRow, focusedCol + 1);
  } else if (direction === 'enter'){
    const section = document.querySelector(`.row-section[data-row-index="${focusedRow}"]`);
    if (section && section.dataset.rendered !== '1') materializeRow(focusedRow, section);
    const card = document.querySelector(`.card[data-row="${focusedRow}"][data-col="${focusedCol}"]`);
    if (card) card.click();
  }
}

  document.getElementById('detail-trailer').innerHTML = '';
  document.getElementById('detail-cast').innerHTML = '';
  document.getElementById('season-container').classList.add('hidden');
  document.getElementById('episodes-list').innerHTML = '';
  document.getElementById('season-chips').innerHTML = '';

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  detailModal.scrollTop = 0;

  addToRecent(item);

  renderDetailBase(item);

  setTimeout(() => {
    const playBtn = document.querySelector('#detail-actions .btn');
    if (playBtn) playBtn.classList.add('focused');
  }, 100);

  try {
    const data = await fetch(
      `${TMDB_API}/${item.type}/${item.tmdb_id}?api_key=${TMDB_KEY}&language=${TMDB_LANG}&append_to_response=credits,videos`
    ).then(r => r.json());
    enrichDetail(data, item.type);
  } catch(e){
    console.warn('Arricchimento TMDB fallito', e);
  }
}

function renderDetailBase(item){
  const tv = item.type === 'tv';
  const rating = item.rating ? Number(item.rating).toFixed(1) : 'N/D';
  document.getElementById('detail-title').textContent = item.title || '';
  document.getElementById('detail-meta').innerHTML = `
    <span class="rating-pill">★ ${rating}</span>
    <span>${esc(item.year || '')}</span>
    <span>${tv ? 'Serie TV' : 'Film'}</span>
    ${(item.genres || []).map(g => `<span>${esc(g)}</span>`).join('')}`;
  /* ▼ se overview manca (catalog slim), placeholder — enrichDetail la riempie */
  document.getElementById('detail-overview').textContent = item.overview || 'Caricamento descrizione…';

  const backdrop = document.getElementById('detail-backdrop');
  if (item.backdrop){ backdrop.src = item.backdrop; backdrop.style.display = 'block'; }

  renderDetailActions(item);
}

function renderDetailActions(item){
  const actions = document.getElementById('detail-actions');
  const scUrl = getScUrl(item);
  const fav = isFavorite(item);
  const inRec = isRecent(item);

  actions.innerHTML = `
    <button type="button" class="btn btn-primary" id="detail-play-btn">▶ Play</button>
    <button type="button" class="btn btn-ghost ${fav ? 'is-fav' : ''}" id="detail-fav-btn">
      ${fav ? '❤ Rimuovi dai preferiti' : '🤍 Aggiungi ai preferiti'}
    </button>
    <button type="button" class="btn btn-ghost" id="detail-recent-remove-btn"
            style="${inRec ? '' : 'display:none'}">
      🕒 Rimuovi dai recenti
    </button>
  `;

  document.getElementById('detail-play-btn').onclick = () => {
    addToRecent(item);
    openExternal(scUrl);
  };
  document.getElementById('detail-fav-btn').onclick = () => toggleFavorite(item);
  document.getElementById('detail-recent-remove-btn').onclick = () => {
    removeFromRecent(item);
    const btn = document.getElementById('detail-recent-remove-btn');
    if (btn) btn.style.display = 'none';
  };
}

function updateDetailActions(item){
  if (!item || currentDetailItem !== item) return;
  const favBtn = document.getElementById('detail-fav-btn');
  if (favBtn){
    const fav = isFavorite(item);
    favBtn.innerHTML = fav ? '❤ Rimuovi dai preferiti' : '🤍 Aggiungi ai preferiti';
    favBtn.classList.toggle('is-fav', fav);
  }
  const recBtn = document.getElementById('detail-recent-remove-btn');
  if (recBtn){
    const inRec = isRecent(item);
    recBtn.style.display = inRec ? '' : 'none';
  }
}

function enrichDetail(data, type){
  const tv = type === 'tv';

  /* ▼ OTTIMIZZAZIONE: overview completa da TMDB (catalog slim) */
  if (data && data.overview && data.overview.trim()){
    document.getElementById('detail-overview').textContent = data.overview;
  }

  const cast = (data.credits?.cast || []).slice(0, 12);
  const castEl = document.getElementById('detail-cast');
  if (cast.length){
    castEl.innerHTML = cast.map(p => `
      <div class="cast-card">
        <img src="${IMG(p.profile_path, 'w185') || NO_AVATAR}" onerror="this.src='${NO_AVATAR}'" alt="">
        <div class="name">${esc(p.name)}</div>
        <div class="role">${esc(p.character || '')}</div>
      </div>`).join('');
  } else {
    castEl.innerHTML = '<p style="color:var(--text-muted);font-size:0.85rem;">Nessuna informazione sul cast.</p>';
  }

  if (tv && Array.isArray(data.seasons) && data.seasons.length > 0){
    renderSeasons(data);
  }
}

/* ═══════════ STAGIONI ═══════════ */
function renderSeasons(tvData){
  const container = document.getElementById('season-container');
  container.classList.remove('hidden');

  const seasons = (tvData.seasons || []).filter(s => s.season_number > 0 && s.episode_count > 0);
  if (!seasons.length){
    document.getElementById('episodes-list').innerHTML = '<div class="ep-info-msg">Nessuna stagione disponibile.</div>';
    return;
  }

  currentSeasons = seasons.map(s => ({
    season_number: s.season_number,
    episode_count: s.episode_count
  }));
  currentSeasonIndex = 0;
  renderSeasonChips();
  loadSeasonFromTMDB(tvData.id, currentSeasons[0].season_number);
}

function renderSeasonChips(){
  document.getElementById('season-chips').innerHTML = currentSeasons.map((s, idx) => `
    <button class="season-chip ${idx === currentSeasonIndex ? 'active' : ''}"
            data-season-idx="${idx}" onclick="selectSeason(${idx})">
      Stagione ${s.season_number}
      <span class="count">(${s.episode_count})</span>
    </button>`).join('');
}

function selectSeason(idx, focusChip = true){
  if (idx < 0 || idx >= currentSeasons.length) return;
  currentSeasonIndex = idx;
  document.querySelectorAll('.season-chip').forEach((chip, i) => chip.classList.toggle('active', i === idx));
  if (focusChip){
    const chip = document.querySelectorAll('.season-chip')[idx];
    if (chip){
      document.querySelectorAll('#detail-modal .focused').forEach(x => x.classList.remove('focused'));
      chip.classList.add('focused');
      chip.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
  }
  const item = currentDetailItem;
  if (item) loadSeasonFromTMDB(item.tmdb_id, currentSeasons[idx].season_number);
}
window.selectSeason = selectSeason;

async function loadSeasonFromTMDB(tvId, seasonNum){
  const list = document.getElementById('episodes-list');
  list.innerHTML = '<p class="loading-ep">Caricamento episodi...</p>';
  try {
    const data = await fetch(
      `${TMDB_API}/tv/${tvId}/season/${seasonNum}?api_key=${TMDB_KEY}&language=${TMDB_LANG}`
    ).then(r => r.json());
    const episodes = data.episodes || [];
    if (!episodes.length){
      list.innerHTML = '<div class="ep-info-msg">Nessun episodio.</div>';
      return;
    }
    const target = getScUrl(currentDetailItem);
    list.innerHTML = episodes.map(ep => {
      const img = ep.still_path ? IMG(ep.still_path, 'w300') : null;
      return `
        <div class="episode-item" onclick="openExternal('${esc(target)}')">
          ${img
            ? `<div class="episode-still"><img src="${img}" loading="lazy" alt=""></div>`
            : `<div class="episode-number-box"><div class="num">${ep.episode_number}</div><div class="label">Ep</div></div>`}
          <div class="episode-info">
            <div class="episode-name">E${ep.episode_number} · ${esc(ep.name || 'Senza titolo')}</div>
            <div class="episode-overview">${esc(ep.overview || '▶ Apri nel player')}</div>
          </div>
        </div>`;
    }).join('');
  } catch(e){
    list.innerHTML = '<div class="ep-info-msg">Errore caricamento episodi.</div>';
  }
}

function closeDetail(){
  if (!isDetailOpen) return;
  isDetailOpen = false;
  currentDetailItem = null;
  currentSeasons = [];
  overlay.classList.remove('open');
  document.body.style.overflow = '';
  document.getElementById('episodes-list').innerHTML = '';
  document.getElementById('season-chips').innerHTML = '';

  if (currentView === 'home' && homeDirty){
    homeDirty = false;
    rebuildHomePreservingFocus();
    return;
  }

  if (lastFocusedCard && document.contains(lastFocusedCard)){
    setFocus(parseInt(lastFocusedCard.dataset.row) || 0, parseInt(lastFocusedCard.dataset.col) || 0);
  } else {
    const first = document.querySelector('#app .card');
    if (first) setFocus(parseInt(first.dataset.row) || 0, parseInt(first.dataset.col) || 0);
    else setHeroFocus(0);
  }
}

/* ═══════════ SEARCH ═══════════ */
searchInputEl.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  const q = searchInputEl.value.trim();
  if (q.length === 0){ renderHome(); return; }
  if (q.length < 2) return;
  searchTimeout = setTimeout(() => performSearch(q), 200);
});

function performSearch(query){
  currentView = 'search';
  document.getElementById('hero').style.display = 'none';
  heroFocusIndex = -1;
  const q = query.toLowerCase();
  const results = CATALOG.filter(it => {
    const hay = (it.title || '') + ' ' + (it.original_title || '') + ' ' +
                (it.year || '') + ' ' + (it.genres || []).join(' ');
    return hay.toLowerCase().includes(q);
  });

  rows = [];
  focusedRow = 0;
  focusedCol = 0;
  const app = document.getElementById('app');
  app.innerHTML = '';

  if (results.length === 0){
    app.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h3>Nessun risultato</h3><p>Prova con un altro titolo.</p></div>`;
    return;
  }

  const header = document.createElement('div');
  header.className = 'view-header';
  header.innerHTML = `<h1>Risultati per "${esc(query)}"</h1><p>${results.length} titol${results.length === 1 ? 'o' : 'i'}</p>`;
  app.appendChild(header);
  const rowConfig = { title: 'Risultati', items: results, type: 'search' };
  rows.push(rowConfig);
  app.appendChild(renderRow(rowConfig, 0));
  setTimeout(() => setFocus(0, 0), 100);
}

/* ═══════════ NAVIGAZIONE DETTAGLIO ═══════════ */
function navigateDetail(key){
  const focusables = Array.from(
    document.querySelectorAll('#detail-modal .btn, #detail-modal .season-chip, #detail-modal .episode-item, #detail-close')
  ).filter(el => {
    const r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0 && el.style.display !== 'none';
  });
  if (!focusables.length) return;

  const current = document.querySelector('#detail-modal .focused') || document.activeElement;
  if (!focusables.includes(current)){
    document.querySelectorAll('#detail-modal .focused').forEach(x => x.classList.remove('focused'));
    focusables[0].classList.add('focused');
    focusables[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  if (current.classList.contains('season-chip')){
    if (key === 'ArrowLeft'){ if (currentSeasonIndex > 0) selectSeason(currentSeasonIndex - 1, true); return; }
    if (key === 'ArrowRight'){ if (currentSeasonIndex < currentSeasons.length - 1) selectSeason(currentSeasonIndex + 1, true); return; }
  }

  const cr = current.getBoundingClientRect();
  const cx = cr.left + cr.width / 2;
  const cy = cr.top + cr.height / 2;
  let best = null, minDist = Infinity;
  for (const el of focusables){
    if (el === current) continue;
    const r = el.getBoundingClientRect();
    const ex = r.left + r.width / 2;
    const ey = r.top + r.height / 2;
    const dx = ex - cx, dy = ey - cy;
    let valid = false;
    if (key === 'ArrowLeft'  && dx < -8) valid = true;
    if (key === 'ArrowRight' && dx >  8) valid = true;
    if (key === 'ArrowUp'    && dy < -8) valid = true;
    if (key === 'ArrowDown'  && dy >  8) valid = true;
    if (!valid) continue;
    let dist = (key === 'ArrowLeft' || key === 'ArrowRight')
      ? Math.abs(dx) + Math.abs(dy) * 4
      : Math.abs(dy) + Math.abs(dx) * 4;
    if (dist < minDist){ minDist = dist; best = el; }
  }
  if (best){
    document.querySelectorAll('#detail-modal .focused').forEach(x => x.classList.remove('focused'));
    best.classList.add('focused');
    best.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

/* ═══════════ TASTIERA ═══════════ */
document.addEventListener('keydown', (e) => {
  const key = e.key;
  const inputHasFocus = document.activeElement === searchInputEl;

  if (key === 'Enter' && enterIsHeld){
    e.preventDefault();
    return;
  }

  if (key === 'Enter'){
    const onDynamic = !isDetailOpen
      && heroFocusIndex < 0
      && !searchFocused
      && !inputHasFocus
      && rows[focusedRow]
      && (rows[focusedRow].type === 'fav' || rows[focusedRow].type === 'recent');

    if (onDynamic){
      e.preventDefault();
      const item = rows[focusedRow].items[focusedCol];
      const rowType = rows[focusedRow].type;
      const cardEl = document.querySelector(`.card[data-row="${focusedRow}"][data-col="${focusedCol}"]`);
      if (item) startEnterHold(item, rowType, cardEl);
      return;
    }
  }

  if (key === 'Enter'){
    if (searchFocused && !inputHasFocus){ e.preventDefault(); activateSearch(); return; }
    if (inputHasFocus){
      e.preventDefault();
      searchInputEl.blur();
      searchWrapEl.classList.remove('focused');
      searchFocused = false;
      const first = document.querySelector('#app .card');
      if (first) setFocus(parseInt(first.dataset.row) || 0, parseInt(first.dataset.col) || 0);
      return;
    }
    if (isDetailOpen){
      const focused = document.querySelector('#detail-modal .focused');
      e.preventDefault();
      if (focused) focused.click();
      return;
    }
    if (heroFocusIndex >= 0){
      e.preventDefault();
      const btn = getHeroButtons()[heroFocusIndex];
      if (btn) btn.click();
      return;
    }
    e.preventDefault();
    moveFocus('enter');
    return;
  }

  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(key)){
    if (enterIsHeld) { e.preventDefault(); return; }
    if (inputHasFocus){
      if (key === 'ArrowDown'){
        e.preventDefault();
        searchInputEl.blur();
        searchWrapEl.classList.remove('focused');
        searchFocused = false;
        setHeroFocus(0);
        return;
      }
      if (key === 'ArrowUp'){ e.preventDefault(); searchInputEl.blur(); setSearchFocus(); return; }
      return;
    }
    if (isDetailOpen){ e.preventDefault(); navigateDetail(key); return; }
    e.preventDefault();
    if (key === 'ArrowUp')    moveFocus('up');
    if (key === 'ArrowDown')  moveFocus('down');
    if (key === 'ArrowLeft')  moveFocus('left');
    if (key === 'ArrowRight') moveFocus('right');
    return;
  }

  if (key === 'Delete' || key === 'Del'){
    if (inputHasFocus) return;
    if (isDetailOpen) return;
    if (heroFocusIndex >= 0 || searchFocused) return;
    const row = rows[focusedRow];
    if (!row) return;
    if (row.type !== 'fav' && row.type !== 'recent') return;
    const item = row.items[focusedCol];
    if (!item) return;
    e.preventDefault();
    if (row.type === 'fav') removeFavorite(item);
    else removeFromRecent(item);
    return;
  }

  if (key === 'Escape' || key === 'Backspace'){
    if (inputHasFocus && key === 'Backspace') return;
    if (inputHasFocus && key === 'Escape'){ e.preventDefault(); searchInputEl.blur(); setSearchFocus(); return; }
    if (inputHasFocus) return;
    if (heroFocusIndex >= 0){ e.preventDefault(); setHeroFocus(-1); return; }
    if (searchFocused){ e.preventDefault(); setHeroFocus(0); return; }
    if (isDetailOpen){ e.preventDefault(); closeDetail(); return; }
    if (currentView === 'search'){ e.preventDefault(); searchInputEl.value = ''; renderHome(); return; }
    return;
  }
});

document.addEventListener('keyup', (e) => {
  if (e.key !== 'Enter') return;
  if (!enterIsHeld) return;

  const wasLong = enterWasLongPress;
  const cardEl = enterHoldCardEl;
  const hadTimer = !!enterHoldTimer;

  enterIsHeld = false;
  enterWasLongPress = false;

  if (hadTimer) cancelEnterHold();
  else { enterHoldItem = null; enterHoldRowType = null; enterHoldCardEl = null; }

  if (wasLong) return;

  if (cardEl && document.contains(cardEl)) {
    lastFocusedCard = cardEl;
    cardEl.click();
  } else {
    const card = document.querySelector(`.card[data-row="${focusedRow}"][data-col="${focusedCol}"]`);
    if (card) { lastFocusedCard = card; card.click(); }
  }
});

/* ═══════════ BOOT ═══════════ */
(async function boot(){
  await loadCatalog();
  loadUserData();
  renderHome();
})();
</script>
